day Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Feel deep affection.","history":"In tennis, 'love' means zero, possibly from the French word for egg.","translations":{"th":{"word":"รัก","definition":"รัก (รู้สึกผูกพันลึกซึ้ง)","history":"ในกีฬาเทนนิส \"love\" แปลว่าศูนย์ อาจมาจากคำภาษาฝรั่งเศสที่แปลว่าไข่"}},"sentence":"I love this song.","thai":"รัก"},{"id":"make","word":"make","letters":4,"spell":"make","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Create or cause.","history":"\"Make\" is used in hundreds of common phrases (\"make a decision\", \"make friends\", \"make dinner\").","translations":{"th":{"word":"ทำ","definition":"ทำ สร้าง หรือก่อให้เกิด","history":"\"Make\" ใช้ในวลีทั่วไปนับร้อย เช่น \"make a decision\", \"make friends\", \"make dinner\""}},"sentence":"Let's make dinner together.","thai":"ทำ"},{"id":"many","word":"many","letters":4,"spell":"many","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"A large number.","history":"\"Many\" is used with countable things like \"many books\".","translations":{"th":{"word":"หลาย","definition":"หลาย (จำนวนมาก)","history":"\"Many\" ใช้กับสิ่งที่นับได้ เช่น \"many books\""}},"sentence":"Many students came early.","thai":"หลาย"},{"id":"more","word":"more","letters":4,"spell":"more","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"A greater amount.","history":"\"More\" is one of the most common comparative words in English.","translations":{"th":{"word":"มากกว่า","definition":"มากกว่า (ปริมาณที่เพิ่มขึ้น)","history":"\"More\" เป็นคำเปรียบเทียบที่พบบ่อยที่สุดคำหนึ่งในภาษาอังกฤษ"}},"sentence":"I need more time.","thai":"มากกว่า"},{"id":"most","word":"most","letters":4,"spell":"most","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"The greatest amount.","history":"\"Most\" is used to talk about the majority of something.","translations":{"th":{"word":"มากที่สุด","definition":"มากที่สุด (ปริมาณสูงสุด)","history":"\"Most\" ใช้พูดถึงส่วนใหญ่ของบางสิ่ง"}},"sentence":"Most people agree.","thai":"มากที่สุด"},{"id":"much","word":"much","letters":4,"spell":"much","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"A large amount.","history":"\"Much\" is used with uncountable things like \"much water\".","translations":{"th":{"word":"มาก","definition":"มาก (ปริมาณมาก)","history":"\"Much\" ใช้กับสิ่งที่นับไม่ได้ เช่น \"much water\""}},"sentence":"How much does it cost?","thai":"มาก"},{"id":"need","word":"need","letters":4,"spell":"need","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Require something important.","history":"'Need' is stronger than 'want' — it suggests necessity, not desire.","translations":{"th":{"word":"ต้องการ","definition":"ต้องการ (จำเป็นต้องมี)","history":"\"Need\" หนักแน่นกว่า \"want\" เพราะสื่อถึงความจำเป็น ไม่ใช่แค่ความอยาก"}},"sentence":"I need a new charger.","thai":"ต้องการ"},{"id":"never","word":"never","letters":5,"spell":"never","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Not ever.","history":"\"Never\" is the strongest way to say something does not happen at any time.","translations":{"th":{"word":"ไม่เคย","definition":"ไม่เคย ไม่เลย","history":"\"Never\" เป็นวิธีที่หนักแน่นที่สุดในการบอกว่าบางสิ่งไม่เกิดขึ้นเลยไม่ว่าเมื่อไร"}},"sentence":"I never eat durian.","thai":"ไม่เคย"},{"id":"new","word":"new","letters":3,"spell":"new","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Not old or recently made.","history":"\"New\" and \"now\" come from the same ancient root.","translations":{"th":{"word":"ใหม่","definition":"ใหม่ (เพิ่งทำขึ้นหรือยังไม่เก่า)","history":"\"New\" กับ \"now\" มาจากรากศัพท์โบราณเดียวกัน"}},"sentence":"She bought a new phone.","thai":"ใหม่"},{"id":"next","word":"next","letters":4,"spell":"next","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Following immediately.","history":"\"Next\" is very useful for talking about future plans.","translations":{"th":{"word":"ถัดไป","definition":"ถัดไป (ตามมาทันที)","history":"\"Next\" มีประโยชน์มากในการพูดถึงแผนในอนาคต"}},"sentence":"See you next week.","thai":"ถัดไป"},{"id":"now","word":"now","letters":3,"spell":"now","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"At this moment.","history":"\"Now\" is one of the most frequently spoken words in everyday conversation.","translations":{"th":{"word":"ตอนนี้","definition":"ตอนนี้ (ในขณะนี้)","history":"\"Now\" เป็นคำที่ถูกพูดบ่อยที่สุดคำหนึ่งในการสนทนาประจำวัน"}},"sentence":"Let's start now.","thai":"ตอนนี้"},{"id":"often","word":"often","letters":5,"spell":"often","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Many times.","history":"\"Often\" is one of the most common frequency adverbs.","translations":{"th":{"word":"บ่อยๆ","definition":"บ่อยๆ (หลายครั้ง)","history":"\"Often\" เป็นคำวิเศษณ์บอกความถี่ที่พบบ่อยที่สุดคำหนึ่ง"}},"sentence":"We often walk here.","thai":"บ่อยๆ"},{"id":"old","word":"old","letters":3,"spell":"old","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"sta yday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Not always.","history":"\"Sometimes\" is very useful for describing things that happen occasionally.","translations":{"th":{"word":"บางครั้ง","definition":"บางครั้ง ไม่เสมอไป","history":"\"Sometimes\" มีประโยชน์มากในการบรรยายสิ่งที่เกิดขึ้นเป็นครั้งคราว"}},"sentence":"Sometimes I cook at home.","thai":"บางครั้ง"},{"id":"start","word":"start","letters":5,"spell":"start","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Begin something.","history":"'Start' and 'begin' are near twins, but 'start' works for engines too.","translations":{"th":{"word":"เริ่ม","definition":"เริ่ม (ลงมือทำบางสิ่ง)","history":"\"Start\" กับ \"begin\" คล้ายกันมาก แต่ \"start\" ใช้กับการสตาร์ทเครื่องยนต์ได้ด้วย"}},"sentence":"Let's start the meeting.","thai":"เริ่ม"},{"id":"still","word":"still","letters":5,"spell":"still","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Continuing up to now.","history":"\"Still\" is very useful for talking about things that continue.","translations":{"th":{"word":"ยังคง","definition":"ยังคง (ดำเนินต่อมาจนถึงตอนนี้)","history":"\"Still\" มีประโยชน์มากในการพูดถึงสิ่งที่ยังดำเนินอยู่"}},"sentence":"She is still working.","thai":"ยังคง"},{"id":"stop","word":"stop","letters":4,"spell":"stop","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"End movement or action.","history":"'Stop' is one of the most recognised English words worldwide, thanks to road signs.","translations":{"th":{"word":"หยุด","definition":"หยุด (ยุติการเคลื่อนไหวหรือการกระทำ)","history":"\"Stop\" เป็นคำภาษาอังกฤษที่คนทั่วโลกรู้จักมากที่สุดคำหนึ่ง ต้องขอบคุณป้ายจราจร"}},"sentence":"Please stop talking.","thai":"หยุด"},{"id":"take","word":"take","letters":4,"spell":"take","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Get hold of or carry away.","history":"'Take' has more dictionary meanings than almost any other English verb.","translations":{"th":{"word":"เอา","definition":"เอา (หยิบหรือนำไป)","history":"\"Take\" มีความหมายในพจนานุกรมมากกว่ากริยาเกือบทุกคำในภาษาอังกฤษ"}},"sentence":"Take an umbrella with you.","thai":"เอา"},{"id":"tell","word":"tell","letters":4,"spell":"tell","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Give information to someone.","history":"You tell someone something, but you say something to someone.","translations":{"th":{"word":"บอก","definition":"บอก (ให้ข้อมูลแก่ใครบางคน)","history":"เราใช้ tell someone something แต่ใช้ say something to someone"}},"sentence":"Tell me the truth.","thai":"บอก"},{"id":"that","word":"that","letters":4,"spell":"that","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Something farther away.","history":"\"That\" is used for things that are not close.","translations":{"th":{"word":"นั้น","definition":"นั้น (สิ่งที่อยู่ไกลออกไป)","history":"\"That\" ใช้กับสิ่งที่อยู่ไม่ใกล้ตัว"}},"sentence":"That was delicious.","thai":"นั้น"},{"id":"there","word":"there","letters":5,"spell":"there","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"In that place.","history":"\"There\" is often used to introduce new information.","translations":{"th":{"word":"ที่นั่น","definition":"ที่นั่น (ในสถานที่นั้น)","history":"\"There\" มักใช้เพื่อเกริ่นนำข้อมูลใหม่"}},"sentence":"The shop is over there.","thai":"ที่นั่น"},{"id":"these","word":"these","letters":5,"spell":"these","to คลื่อนที่ด้วยเท้า)","history":"\"Walk\" เคยแปลว่ากลิ้งหรือโยน แล้วค่อยๆ เปลี่ยนความหมายมา"}},"sentence":"Let's walk to the market.","thai":"เดิน"},{"id":"want","word":"want","letters":4,"spell":"want","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Wish to have something.","history":"'Want' originally meant to lack something, which is why 'wanting' can mean missing.","translations":{"th":{"word":"อยากได้","definition":"อยากได้ (ปรารถนาจะมีบางสิ่ง)","history":"เดิมที \"want\" แปลว่าขาดบางสิ่ง จึงเป็นเหตุผลว่าทำไม \"wanting\" หมายถึงการขาดหายได้"}},"sentence":"Do you want some tea?","thai":"อยากได้"},{"id":"will","word":"will","letters":4,"spell":"will","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Future or determination.","history":"\"Will\" originally meant \"to want\" or \"to desire\" in Old English. That's why we say \"I will\" when we make a firm decision.","translations":{"th":{"word":"จะ","definition":"จะ (อนาคตหรือความตั้งใจ)","history":"เดิมที \"will\" แปลว่า \"ต้องการ\" หรือ \"ปรารถนา\" ในภาษาอังกฤษเก่า จึงเป็นเหตุผลว่าทำไมเราพูด \"I will\" เมื่อตัดสินใจแน่วแน่"}},"sentence":"I will call you later.","thai":"จะ"},{"id":"with","word":"with","letters":4,"spell":"with","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Together with someone or something.","history":"\"With\" shows connection or company and is extremely common.","translations":{"th":{"word":"กับ","definition":"กับ (อยู่ร่วมกับคนหรือสิ่งใด)","history":"\"With\" แสดงความเชื่อมโยงหรือการอยู่ร่วมกัน และพบบ่อยมาก"}},"sentence":"Come with me.","thai":"กับ"},{"id":"work","word":"work","letters":4,"spell":"work","topic":"High-Frequency / Core","topic2":"Jobs & Work","sublist":"Everyday Verbs & Function Words","phase arter Pack","phase":1,"starter":true,"rudeness":null,"definition":"Specific location or time.","history":"\"At\" is used for exact times and places (\"at school\", \"at 3 o'clock\").","translations":{"th":{"word":"ที่","definition":"ที่ (บอกตำแหน่งหรือเวลาที่เจาะจง)","history":"\"At\" ใช้กับเวลาและสถานที่ที่เจาะจง เช่น \"at school\", \"at 3 o'clock\""}},"sentence":"I am at the door.","thai":"ที่"},{"id":"do","word":"do","letters":2,"spell":"do","topic":"High-Frequency / Core","topic2":null,"sublist":"Starter Pack","phase":1,"starter":true,"rudeness":null,"definition":"Perform an action.","history":"\"Do\" is used as a helper verb in questions and negatives, which is unusual compared to many other languages.","translations":{"th":{"word":"ทำ","definition":"ทำ (กระทำสิ่งใดสิ่งหนึ่ง)","history":"\"Do\" ใช้เป็นกริยาช่วยในประโยคคำถามและปฏิเสธ ซึ่งต่างจากภาษาอื่นๆ หลายภาษา"}},"sentence":"Do your homework now.","thai":"ทำ"},{"id":"go","word":"go","letters":2,"spell":"go","topic":"High-Frequency / Core","topic2":null,"sublist":"Starter Pack","phase":1,"starter":true,"rudeness":null,"definition":"Move to a place.","history":"\"Go\" is one of the most common action verbs and is used in hundreds of phrases.","translations":{"th":{"word":"ไป","definition":"ไป (เคลื่อนที่ไปยังที่หนึ่ง)","history":"\"Go\" เป็นกริยาแสดงการกระทำที่พบบ่อยที่สุดคำหนึ่ง และใช้ในสำนวนนับร้อย"}},"sentence":"Let's go home.","thai":"ไป"},{"id":"if","word":"if","letters":2,"spell":"if","topic":"High-Frequency / Core","topic2":null,"sublist":"Starter Pack","phase":1,"starter":true,"rudeness":null,"definition":"Condition.","history":"\"If\" is one of the most important words for talking about possibilities and conditions.","translations":{"th":{"word":"ถ้า","definition":"ถ้า (เงื่อนไข)","history":"\"If\" เป็นคำสำคัญที่สุดคำหนึ่งสำหรับพูดถึงความเป็นไปได้และเงื่อนไข"}},"sentence":"Call me if you need help.","thai":"ถ้า"},{"id":"in","word":"in","letters":2,"spell":"in","topic":"High-Frequency / Core","topic2":n outs just before serving.","thai":"ถั่วงอก"},{"id":"bitter_gourd","word":"bitter gourd","letters":11,"spell":"bittergourd","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A bumpy green vegetable with a bitter taste.","history":"It is eaten across Asia for its supposed health benefits despite the taste.","translations":{"th":{"word":"มะระ","definition":"ผักสีเขียวผิวขรุขระที่มีรสขม","history":"คนเอเชียกินมะระเพราะเชื่อว่ามีประโยชน์ต่อสุขภาพ แม้จะมีรสขม"}},"sentence":"Bitter gourd is an acquired taste.","thai":"มะระ"},{"id":"broccoli","word":"broccoli","letters":8,"spell":"broccoli","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A green vegetable with a tree-like head.","history":"Broccoli is a man-made vegetable developed from wild cabbage. It is one of the healthiest vegetables you can eat.","translations":{"th":{"word":"บรอกโคลี","definition":"ผักสีเขียวที่มีหัวคล้ายต้นไม้","history":"บรอกโคลีเป็นผักที่มนุษย์พัฒนาขึ้นจากกะหล่ำป่า และเป็นผักที่ดีต่อสุขภาพที่สุดชนิดหนึ่ง"}},"sentence":"Steam the broccoli for three minutes.","thai":"บรอกโคลี"},{"id":"cabbage","word":"cabbage","letters":7,"spell":"cabbage","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A round leafy vegetable.","history":"Cabbage is one of the oldest cultivated vegetables. It is the main ingredient in kimchi and sauerkraut.","translations":{"th":{"word":"กะหล่ำปลี","definition":"ผักใบทรงกลม","history":"กะหล่ำปลีเป็นผักที่ปลูกมาเก่าแก่ที่สุดชนิดหนึ่ง และเป็นวัตถุดิบหลักของกิมจิและซาวเคราท์"}},"sentence":"Shredded cabbage goes in the slaw.","thai":"กะหล่ำปลี"},{"id":"carrot","word":"carrot","letters":6,"spell":"carrot","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A long orange root vegetable.","history":"Carrots were originally purple. The orange ones were developed in the Netherlands to honor their royal family — the House of Orange.","translations":{"th":{"word":"แครอท","definition":"ผักรากยาวสีส้ม","history":"เดิมทีแครอทมีสีม่วง พันธุ์สีส้มถูกพัฒนาขึ้นในเนเธอร์แลนด์เพื่อเป็นเกียรติแก่ราชวงศ์ออเรนจ์"}},"sentence":"Rabbits are not the only carrot fans.","thai":"แครอท"},{"id":"cauliflower","word":"cauliflower","letters":11,"spell":"cauliflower","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A white vegetable similar to broccoli.","history":"Cauliflower can also be purple, green, or orange. It is very versatile in cooking.","translations":{"th":{"word":"กะหล่ำดอก","definition":"ผักสีขาวที่คล้ายบรอกโคลี","history":"กะหล่ำดอกมีทั้งสีม่วง เขียว และส้มด้วย และนำไปปรุงได้หลากหลายมาก"}},"sentence":"Cauliflower can replace rice.","thai":"กะหล่ำดอก"},{"id":"celery","word":"celery","letters":6,"spell":"celery","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A crisp green vegetable with long stalks.","history":"Celery was originally used as medicine before it became a food. It is very low in calories.","translations":{"th":{"word":"ขึ้นฉ่าย","definition":"ผักสีเขียวกรอบที่มีก้านยาว","history":"เดิมทีขึ้นฉ่ายถูกใช้เป็นยาก่อนจะกลายมาเป็นอาหาร และมีแคลอรีต่ำมาก"}},"sentence":"Celery sticks with peanut butter.","thai":"ขึ้นฉ่าย"},{"id":"chili","word":"chili","letters":5,"spell":"chili","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A small hot pepper.","history":"Chili peppers were brought to Asia by Portuguese traders. They are now essential in Thai and Indian cooking.","translations":{"th":{"word":"พริก","definition":"พริกลูกเล็กรสเผ็ด","history":"พ่อค้าชาวโปรตุเกสนำพริกเข้ามาในเอเชีย ปัจจุบันพริกเป็นวัตถุดิบสำคัญในอาหารไทยและอินเดีย"}},"sentence":"This chili is extremely hot.","thai":"พริก"},{"id":"chive","word":"chive","letters": les in the cabbage family. It has become very popular as a \"superfood\" in recent years.","translations":{"th":{"word":"คะน้าใบหยิก","definition":"ผักใบเขียว","history":"คะน้าใบหยิกเป็นผักที่เก่าแก่ที่สุดชนิดหนึ่งในตระกูลกะหล่ำ และได้รับความนิยมอย่างมากในฐานะ \"ซูเปอร์ฟู้ด\" ในช่วงหลัง"}},"sentence":"Kale chips are crispy and salty.","thai":"คะน้าใบหยิก"},{"id":"leek","word":"leek","letters":4,"spell":"leek","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A long vegetable with a mild onion flavor.","history":"Leeks are the national emblem of Wales. They have been cultivated for over 4,000 years.","translations":{"th":{"word":"กระเทียมต้น","definition":"ผักก้านยาวที่มีกลิ่นหอมอ่อนคล้ายหอมหัวใหญ่","history":"กระเทียมต้นเป็นสัญลักษณ์ประจำชาติเวลส์ และถูกปลูกมากว่า 4,000 ปี"}},"sentence":"Leek soup is warm and mild.","thai":"กระเทียมต้น"},{"id":"lettuce","word":"lettuce","letters":7,"spell":"lettuce","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A leafy green vegetable used in salads.","history":"Lettuce has been cultivated for over 6,000 years. It was considered a sacred plant in ancient Egypt.","translations":{"th":{"word":"ผักกาดหอม","definition":"ผักใบเขียวที่ใช้ทำสลัด","history":"ผักกาดหอมถูกปลูกมากว่า 6,000 ปี และเคยถือเป็นพืชศักดิ์สิทธิ์ในอียิปต์โบราณ"}},"sentence":"Wash the lettuce before serving.","thai":"ผักกาดหอม"},{"id":"mushroom","word":"mushroom","letters":8,"spell":"mushroom","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A fungus used as a vegetable.","history":"Mushrooms are not plants. They are fungi and have been eaten for thousands of years.","translations":{"th":{"word":"เห็ด","definition":"เห็ดราที่ใช้เป็นผัก","history":"เห็ดไม่ใช่พืช แต่เป็นฟังไจ และมนุษย์กินเห็ดมานับพันปี"}},"sentence":"Fried mushroom smells wonderful.","thai":"เห็ด"},{"id":"okra","word":"okra","letters":4,"spell":"okra","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A green pod vegetable.","history":"Okra is also called lady's finger. It is used to thicken soups and stews in many cuisines.","translations":{"th":{"word":"กระเจี๊ยบเขียว","definition":"ผักฝักสีเขียว","history":"กระเจี๊ยบเขียวมีอีกชื่อว่า lady's finger ใช้ทำให้ซุปและสตูข้นในหลายวัฒนธรรมอาหาร"}},"sentence":"Okra becomes slippery when cooked.","thai":"กระเจี๊ยบเขียว"},{"id":"onion","word":"onion","letters":5,"spell":"onion","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A round vegetable with layers and strong flavor.","history":"Onions make people cry because they release a chemical that irritates the eyes. They have been cultivated for over 5,000 years.","translations":{"th":{"word":"หัวหอม","definition":"ผักหัวกลมที่มีชั้นซ้อนกันและกลิ่นแรง","history":"หอมใหญ่ทำให้คนน้ำตาไหลเพราะปล่อยสารเคมีที่ระคายเคืองตา และถูกปลูกมากว่า 5,000 ปี"}},"sentence":"Chopping onion made me cry.","thai":"หัวหอม"},{"id":"parsnip","word":"parsnip","letters":7,"spell":"parsnip","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A sweet pale root like a carrot.","history":"Parsnips were used as a sweetener in Europe before sugar was common.","translations":{"th":{"word":"พาร์สนิป","definition":"รากพืชสีซีดรสหวานคล้ายแครอท","history":"ในยุโรปเคยใช้พาร์สนิปเป็นสารให้ความหวานก่อนที่น้ำตาลจะแพร่หลาย"}},"sentence":"Roast parsnips turn golden and sweet.","thai":"พาร์สนิป"},{"id":"pea","word":"pea","letters":3,"spell":"pea","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A small round green seed.","history":"Peas are one of the first vegetables mentioned in history. They were eaten in ancient Egypt and China.","translations":{"th":{"word":"ถั่วลันเตา","definition":"เมล็ดกลมเล็กสีเขียว","history":"ถั่วลันเตาเป็นผักชนิดแรกๆ ที่ถูกบันทึกในประวัติศาสตร์ และถูกกินในอียิปต์และจีนโบราณ"}},"sentence":"Add frozen peas at the end.","thai":"ถั่วลันเตา"},{"id":"pepper","word":"pepper","letters":6,"spell":"pepper","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A vegetable that can be green, red, or yellow.","history":"Bell peppers are very high in vitamin C. They were brought to Europe by Christopher Columbus.","translations":{"th":{"word":"พริกไทย","definition":"ผักที่มีทั้งสีเขียว แดง และเหลือง","history":"พริกหวานมีวิตามินซีสูงมาก และถูกนำเข้าสู่ยุโรปโดยคริสโตเฟอร์ โคลัมบัส"}},"sentence":"Add salt and pepper to taste.","thai":"พริกไทย"},{"id":"potato","word":"potato","letters":6,"spell":"potato","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A starchy root vegetable.","history":"Potatoes originated in the Andes. They are so important that the Irish Potato Famine changed the course of history.","translations":{"th":{"word":"มันฝรั่ง","definition":"ผักหัวที่มีแป้งมาก","history":"มันฝรั่งมีถิ่นกำเนิดในเทือกเขาแอนดีส และสำคัญมากจนเหตุการณ์ทุพภิกขภัยมันฝรั่งในไอร์แลนด์เปลี่ยนหน้าประวัติศาสตร์"}},"sentence":"Mashed potato is comfort food.","thai":"มันฝรั่ง"},{"id":"pumpkin","word":"pumpkin","letters":7,"spell":"pumpkin","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A large orange gourd.","history":"Pumpkins are native to North America. They are used for both food and Halloween decoration.","translations":{"th":{"word":"ฟักทอง","definition":"ฟักลูกใหญ่สีส้ม","history":"ฟักทองมีถิ่นกำเนิดในอเมริกาเหนือ ใช้ทั้งเป็นอาหารและของประดับวันฮาโลวีน"}},"sentence":"Pumpkin soup is thick and orange.","thai":"ฟักทอง"},{"id":"radish","word":"radish","letters":6,"spell":"radish","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"ruden ","phase":1,"starter":false,"rudeness":null,"definition":"A family of soft-fleshed gourds.","history":"In Britain 'squash' also means a fruit drink, which confuses recipes.","translations":{"th":{"word":"ฟักทองชนิดหนึ่ง","definition":"กลุ่มพืชตระกูลฟักที่มีเนื้อนุ่ม","history":"ในอังกฤษคำว่า squash ยังหมายถึงเครื่องดื่มผลไม้ด้วย ซึ่งทำให้สูตรอาหารสับสนได้"}},"sentence":"Butternut squash makes creamy soup.","thai":"ฟักทองชนิดหนึ่ง"},{"id":"sweet_potato","word":"sweet potato","letters":11,"spell":"sweetpotato","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A sweet orange root vegetable.","history":"Sweet potatoes are not related to regular potatoes. They are one of the oldest cultivated vegetables in the Americas.","translations":{"th":{"word":"มันเทศ","definition":"ผักหัวสีส้มรสหวาน","history":"มันเทศไม่ได้เป็นญาติกับมันฝรั่ง และเป็นผักที่ปลูกมาเก่าแก่ที่สุดชนิดหนึ่งในทวีปอเมริกา"}},"sentence":"Roasted sweet potato is naturally sweet.","thai":"มันเทศ"},{"id":"taro","word":"taro","letters":4,"spell":"taro","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A starchy root vegetable with purple spots.","history":"Taro is one of the oldest cultivated crops in the world. It is a staple in many Pacific islands.","translations":{"th":{"word":"เผือก","definition":"ผักหัวที่มีแป้งมากและมีจุดสีม่วง","history":"เผือกเป็นพืชที่ปลูกมาเก่าแก่ที่สุดชนิดหนึ่งของโลก และเป็นอาหารหลักในหมู่เกาะแปซิฟิก"}},"sentence":"Taro milk tea is purple.","thai":"เผือก"},{"id":"tomato","word":"tomato","letters":6,"spell":"tomato","topic":"Vegetables","topic2":null,"sublist":"Everyday","phase":1,"starter":false,"rudeness":null,"definition":"A round red fruit used as a vegetable.","history":"Tomatoes were once thought to be poisonous in Europe. Now they are one of the most eaten \"vegetables\" in the world.","translations":{"th":{"word":"มะเขือเทศ","definition":"ผลไม้ทรงกลมสีแด ic":"Emotions & Feelings","topic2":null,"sublist":"Basic & Complex","phase":2,"starter":false,"rudeness":null,"definition":"Noticeably happy and bright.","history":"'Cheer' originally meant the face, then the mood it showed.","translations":{"th":{"word":"ร่าเริง","definition":"ร่าเริง มีความสุขและสดใสอย่างเห็นได้ชัด","history":"เดิมที cheer หมายถึงใบหน้า แล้วจึงกลายเป็นอารมณ์ที่ใบหน้านั้นแสดงออก"}},"sentence":"She greeted us with a cheerful smile.","thai":"ร่าเริง"},{"id":"confused","word":"confused","letters":8,"spell":"confused","topic":"Emotions & Feelings","topic2":null,"sublist":"Basic & Complex","phase":2,"starter":false,"rudeness":null,"definition":"Unable to understand.","history":"'Confused' comes from Latin meaning poured together.","translations":{"th":{"word":"สับสน","definition":"สับสน ไม่สามารถเข้าใจได้","history":"คำว่า confused มาจากภาษาละตินที่แปลว่าเทรวมกัน"}},"sentence":"I'm confused by these directions.","thai":"สับสน"},{"id":"content","word":"content","letters":7,"spell":"content","topic":"Emotions & Feelings","topic2":null,"sublist":"Basic & Complex","phase":2,"starter":false,"rudeness":null,"definition":"Quietly satisfied.","history":"The emotion and the word for 'what's inside' are spelled alike.","translations":{"th":{"word":"พึงพอใจ","definition":"พึงพอใจ อิ่มใจอย่างเงียบๆ","history":"คำที่แปลว่าอารมณ์นี้กับคำที่แปลว่า 'สิ่งที่อยู่ข้างใน' สะกดเหมือนกัน"}},"sentence":"She felt content by the fire.","thai":"พึงพอใจ"},{"id":"curious","word":"curious","letters":7,"spell":"curious","topic":"Emotions & Feelings","topic2":null,"sublist":"Basic & Complex","phase":2,"starter":false,"rudeness":null,"definition":"Wanting to know more.","history":"'Curious' can describe both the asker and the strange thing asked about.","translations":{"th":{"word":"อยากรู้อยากเห็น","definition":"อยากรู้อยากเห็น ต้องการรู้มากขึ้น","history":"คำว่า curious ใช้บรรยายได้ทั้งคนที่อยากรู้และสิ่งแปลกที่ถูกถามถึง"}},"sentence":"Cats are naturally curious.","thai":"อยากรู้อยา let fast=false, lang='th';
/* `building` is the word tray: each entry is a letter taken from a pool slot,
   or a free space. The pool letter is never removed — it just highlights. */
let building=[];                       // [{ch:'m', from:3} | {ch:' ', from:null}]
const typedWord = () => building.map(b=>b.ch).join('');

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem('vocap',JSON.stringify({seen:[...seen],sparks,inked:[...inked],starterDay,lastGift}));
const load=()=>{try{const d=JSON.parse(localStorage.getItem('vocap'));
  if(d){seen=new Set(d.seen);sparks=d.sparks;
        inked=new Set(d.inked||[]);starterDay=d.starterDay||0;lastGift=d.lastGift||null;}
  }catch(e){}};

/* ---- speech: browser-native, no audio files needed ----
   Pronunciation is the one thing a text game can't teach, so discovered
   words are spoken by default. Letter-by-letter is opt-in: useful when
   learning, grating in fast mode. */
let sayWords=true, sayLetters=false, voiceEN=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voiceEN = vs.find(v=>/^en-(GB|US)/.test(v.lang)&&/natural|google|samantha|daniel/i.test(v.name))
         || vs.find(v=>v.lang.startsWith('en')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,{rate=0.95,pitch=1}={}){
  if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=rate; u.pitch=pitch; u.volume=1;
  if(voiceEN) u.voice=voiceEN;
  speechSynthesis.speak(u);
}
function speakLetter(ch){
  if(!sayLetters||ch===' ') return;
  speechSynthesis.cancel();               // keep up with fast tapping
  speak(ch.toUpperCase(),{rate:0.85});
}
function speakWord(w){
  if(!sayWords) return;
  speechSynthesis.cancel();
  speak(w,{rate:0.85});                   // clear and unhurried: this is the teaching moment
}

function sparksFor(n){return n<=5?10:n<=8?25:n<=12?60:150}
function count(s){const c={};for(const ch of s)if(ch!==' ')c[ch]=(c[ch]||0)+1;return c}
function canSpell(need,poolC){for(const k in need)if((poolC[k]||0)<need[k])return false;return true}
function union(a,b){const o={...a};for(const k in b)o[k]=Math.max(o[k]||0,b[k]);return o}
function poolCount(){const c={};for(const ch of pool)c[ch]=(c[ch]||0)+1;return c}

/* growing tray: +1 slot per 2 completed sub-lists (design §3.5) */
function traySize(){
  const subs={};
  for(const w of BANK){const k=w.topic+'|'+w.sublist;(subs[k]=subs[k]||[]).push(w)}
  let done=0;
  for(const k in subs) if(subs[k].every(w=>seen.has(w.id))) done++;
  return Math.min(POOL_CAP, POOL_START + Math.floor(done/2));
}

/* ---- seed picking: adaptive bands + HF cooldown (drop_engine.py port) ---- */
function pickSeeds(size){
  const budget=size-MIN_NOISE, allowHF=(cycleNo%HF_COOLDOWN===0);
  const chosen=[]; let acc={};
  // unsolved clues from last cycle come back first (§3.6 clue lifecycle)
  for(const w of carryClues){
    const trial=union(acc,count(w.spell));
    if(Object.values(trial).reduce((a,b)=>a+b,0)<=budget){chosen.push(w);acc=trial}
  }
  const bands=[...PLAN].sort((a,b)=>b[1]-a[1]);
  for(const [lo0,hi0] of bands){
    if(chosen.length>=3)break;
    let cands=[];
    for(let g=0;g<13 && !cands.length;g++){          // adaptive widening
      const lo=Math.max(3,lo0-g), hi=Math.min(15,hi0+g);
      cands=BANK.filter(w=>!seen.has(w.id)&&!chosen.includes(w)
        &&w.letters>=lo&&w.letters<=hi&&(allowHF||w.topic!==HF));
    }
    cands.sort(()=>Math.random()-.5);
    for(const w of cands.slice(0,80)){
      const trial=union(acc,count(w.spell));
      if(Object.values(trial).reduce((a,b)=>a+b,0)<=budget){chosen.push(w);acc=trial;break}
    }
  }
  return [chosen,acc];
}

function noiseLetters(acc,n){
  const out=[], ls=Object.keys(FREQ);
  for(let i=0;i<n;i++){
    const cur={...acc}; for(const ch of out)cur[ch]=(cur[ch]||0)+1;
    const tot=Object.values(cur).reduce((a,b)=>a+b,0)||1;
    const vr=Object.entries(cur).filter(([k])=>VOWELS.has(k)).reduce((a,[,v])=>a+v,0)/tot;
    const ws=ls.map(l=>FREQ[l]*(vr<0.32&&VOWELS.has(l)?4:1));
    let r=Math.random()*ws.reduce((a,b)=>a+b,0);
    for(let j=0;j<ls.length;j++){r-=ws[j];if(r<=0){out.push(ls[j]);break}}
  }
  return out;
}

/* shortest seed's letters first so something is formable early */
function buildOrder(size){
  const sorted=[...seeds].sort((a,b)=>a.letters-b.letters);
  let ord=[], built={};
  for(const w of sorted){
    const need=count(w.spell), chunk=[];
    for(const k in need)for(let i=(built[k]||0);i<need[k];i++)chunk.push(k);
    chunk.sort(()=>Math.random()-.5); ord=ord.concat(chunk); built=union(built,need);
  }
  ord=ord.concat(noiseLetters(built,Math.max(MIN_NOISE,size-ord.length)));
  const head=sorted.length?Math.min(sorted[0].letters,ord.length):0;
  const tail=ord.slice(head).sort(()=>Math.random()-.5);
  return ord.slice(0,head).concat(tail).slice(0,size);
}

/* ---------------- cycle control ---------------- */
function startCycle(){
  cycleNo++; const size=traySize();
  [seeds,]=pickSeeds(size); order=buildOrder(size);
  pool=[]; dropped=0; repeatPaid=new Set(); carryClues=[]; building=[];
  $('traysize').textContent=size;
  renderTray(); renderWordTray(); renderClue(); scheduleDrop();
}
function scheduleDrop(){
  clearTimeout(timerId);
  const ms=fast?FAST_MS:INTERVAL_MS; nextDrop=Date.now()+ms;
  timerId=setTimeout(dropLetter,ms); tickTimer();
}
function tickTimer(){
  const s=Math.max(0,Math.ceil((nextDrop-Date.now())/1000));
  $('timer').textContent=dropped>=order.length?'LAST CALL':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(dropped<=order.length)setTimeout(tickTimer,500);
}
function dropLetter(){
  if(dropped<order.length){
    pool.push(order[dropped]); dropped++;
    renderTray(); renderWordTray(); renderClue(); scheduleDrop();
  }else{ // Last Call ends: harvest leftovers, carry unsolved clues, new cycle
    sparks+=pool.length;
    carryClues=seeds.filter(w=>!seen.has(w.id)).slice(0,2);
    save(); startCycle();
  }
}

/* ---------------- rendering ---------------- */
function renderTray(){
  const size=order.length||traySize(); const t=$('tray'); t.innerHTML='';
  const used=highlightMap();
  for(let i=0;i<size;i++){
    const d=document.createElement('div');
    d.className='slot '+(i<pool.length?'filled':'empty');
    if(i<pool.length){
      d.textContent=pool[i];
      if(used.has(i))d.classList.add('used');
      d.onclick=()=>{ if(!used.has(i)){speakLetter(pool[i]);building.push({ch:pool[i],from:i});renderTray();renderWordTray()} };
    }
    t.appendChild(d);
  }
  $('sparks').textContent=sparks;
  $('foundcount').textContent=seen.size;
  $('inkcount').textContent=inked.size;
}
/* which pool boxes are currently in use down in the word tray */
function highlightMap(){
  return new Set(building.filter(b=>b.from!==null).map(b=>b.from));
}

/* claim the first unused pool slot holding this letter; null if none free */
function claimSlot(ch){
  const used=highlightMap();
  for(let i=0;i<pool.length;i++) if(pool[i]===ch && !used.has(i)) return i;
  return null;
}

/* draw the word tray */
function renderWordTray(){
  const wt=$('wordtray'); wt.innerHTML='';
  if(!building.length){
    wt.innerHTML='<span class="hint">tap letters above to build a word</span>';
    wt.className=''; $('typed').textContent=''; $('submit').disabled=true; return;
  }
  building.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='wslot'+(b.ch===' '?' space':'');
    d.textContent=b.ch===' '?'':b.ch;
    d.title='remove';
    d.onclick=()=>{building.splice(i,1);renderTray();renderWordTray()};
    wt.appendChild(d);
  });
  const w=typedWord().replace(/ /g,'');
  const match=BANK.find(x=>x.spell===typedWord()||x.spell===w);
  wt.className = (w.length>=3 && match && !seen.has(match.id)) ? 'ready' : '';
  $('submit').disabled = w.length<3;
  $('typed').textContent=w.length+' letters';
}
function renderClue(){
  const active=seeds.filter(w=>!seen.has(w.id));
  const el=$('clue');
  if(!active.length){el.textContent='';return}
  const pc=poolCount();
  el.innerHTML=active.map(w=>{
    const desc = lang==='th' && w.translations?.th?.definition
        ? w.translations.th.definition : w.definition;
    const ok=canSpell(count(w.spell),pc);
    return `<span class="${ok?'spellable':''}">🔎 ${desc} — ${w.letters} letters</span>`;
  }).join('<br>');
  el.className=active.some(w=>canSpell(count(w.spell),poolCount()))?'spellable':'';
}

/* ---------------- word submission ---------------- */
function submit(){
  const word=typedWord().trim().toLowerCase();
  building=[]; renderWordTray();
  if(word.replace(/ /g,'').length<3){flash('too short','bad');renderTray();return}
  const w=BANK.find(x=>x.spell===word.replace(/ /g,'')||x.word===word);
  const pc=poolCount();
  if(!w){
    // Not curated — but it may still be a real English word worth 2 sparks
    // and a page in the Dictionary (design 5.4).
    const plain=word.replace(/ /g,'');
    if(DICT.has(plain)){
      if(!canSpell(count(plain),pc)){flash('letters not in the tray','bad');renderTray();return}
      if(inked.has(plain)){
        if(!repeatPaid.has(plain)){sparks++;repeatPaid.add(plain);flash('already inked · +1','good')}
        else flash('already inked this cycle','');
      }else{
        inked.add(plain); sparks+=2; save(); speakWord(plain);
        showDictCard(plain);
        const before=Math.floor((inked.size-1)/100), after=Math.floor(inked.size/100);
        if(after>before){sparks+=100;flash(`📖 ${inked.size} words inked · +100 ✨ milestone!`,'good')}
        else flash(`📖 inked in the Dictionary · +2 ✨`,'good');
      }
      renderTray();return;
    }
    flash('not an English word','bad');renderTray();return;
  }
  if(!canSpell(count(w.spell),pc)){flash('letters not in the tray','bad');renderTray();return}
  if(seen.has(w.id)){
    if(!repeatPaid.has(w.id)){sparks++;repeatPaid.add(w.id);speakWord(w.word);flash('already found · +1','good')}
    else flash('already found this cycle','');
    renderTray();return;
  }
  // NEW DISCOVERY — freshness bonus pays more when the tray is emptier (§4.4)
  const fresh=1+(order.length-dropped)/8;
  const gain=Math.round(sparksFor(w.letters)*fresh);
  sparks+=gain; seen.add(w.id); save();
  speakWord(w.word);
  showCard(w,gain); logWord(w);
  flash(`+${gain} ✨`,'good');
  renderTray(); renderClue();
  const size=traySize();               // sub-list may have completed → tray grows next cycle
  $('traysize').textContent=size;
}
function showCard(w,gain){
  $('c-word').textContent=w.word;
  $('c-thword').textContent=lang==='th'?(w.thai||''):'';
  $('c-def').textContent=w.definition;                       // English ALWAYS shows (§6)
  $('c-thdef').textContent=lang==='th'?(w.translations?.th?.definition||''):'';
  $('c-hist').textContent=w.history;
  $('c-thhist').textContent=lang==='th'?(w.translations?.th?.history||''):'';
  $('c-sent').textContent=w.sentence?'"'+w.sentence+'"':'';
  $('c-meta').textContent=`${w.letters} letters · fills ${w.topic}${w.topic2?' + '+w.topic2:''} · +${gain} sparks`;
  $('card').className='show';
}
/* Dictionary card — deliberately plainer than a discovery card. The curated
   966 get history, Thai and (later) art; dictionary words get a definition
   and a page. The gap between them is what makes the collection feel special. */
function showDictCard(word){
  $('c-word').textContent=word;
  $('c-thword').textContent='';
  $('c-def').textContent=DEFS[word]||'(no definition available)';
  $('c-thdef').textContent=''; $('c-hist').textContent='';
  $('c-thhist').textContent=''; $('c-sent').textContent='';
  $('c-meta').textContent=`${word.length} letters · Dictionary word #${inked.size} · +2 sparks`;
  $('card').className='show dict';
}

function logWord(w){$('log').innerHTML+=`<span>${w.word}</span>`}
function flash(t,c){$('msg').textContent=t;$('msg').className=c||''}

/* ---------------- input ---------------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){submit();return}
  if(e.key==='Escape'){building=[];renderTray();renderWordTray();return}
  if(e.key==='Backspace'){building.pop()}
  else if(e.key===' '){building.push({ch:' ',from:null});e.preventDefault()}   // free space
  else if(/^[a-zA-Z']$/.test(e.key)){
    const ch=e.key.toLowerCase();
    const slot=claimSlot(ch);
    if(slot===null){flash(`no free "${ch}" in the tray`,'bad');return}
    speakLetter(ch);
    building.push({ch,from:slot});
  }
  else return;
  $('card').className='';
  flash('');
  renderTray(); renderWordTray();
});
$('c-word').onclick=()=>{speechSynthesis.cancel();speak($('c-word').textContent,{rate:0.8})};
$('say').onclick=()=>{sayWords=!sayWords;$('say').textContent='🔊 words: '+(sayWords?'ON':'OFF')};
$('sayl').onclick=()=>{sayLetters=!sayLetters;$('sayl').textContent='🔤 letters: '+(sayLetters?'ON':'OFF')};
$('submit').onclick=()=>submit();
$('clear').onclick=()=>{building=[];renderTray();renderWordTray()};
$('speed').onclick=()=>{fast=!fast;$('speed').textContent='⚡ fast mode: '+(fast?'ON':'OFF');scheduleDrop()};
$('lang').onclick=()=>{lang=lang==='th'?'en':'th';$('lang').textContent='clue: '+lang.toUpperCase();renderClue()};
$('reset').onclick=()=>{if(confirm('Wipe save?')){localStorage.removeItem('vocap');location.reload()}};

/* ---- Starter Pack: the ten 2-letter words can't be spelled (3-letter
   minimum), so they arrive as a daily gift. Doubles as the tutorial and
   completes a sub-list on day 10, which triggers the first tray upgrade. ---- */
function starterGift(){
  const today=new Date().toISOString().slice(0,10);
  if(lastGift===today) return;                       // one per day
  const gifts=BANK_ALL.filter(w=>w.starter&&!seen.has(w.id));
  if(!gifts.length) return;
  const w=gifts[0];
  seen.add(w.id); lastGift=today; starterDay++; sparks+=10; save();
  setTimeout(()=>{ speakWord(w.word); showCard(w,10);
    flash(`🎁 Starter Pack gift ${starterDay}/10 — "${w.word}"`,'good'); }, 600);
}

/* ---------------- boot ---------------- */
let BANK_ALL=[];
Promise.resolve([window.__VOCAP_DATA__, window.__VOCAP_DICT__]).then(([d,dict])=>{
  BANK_ALL=d.words;
  // formable = non-starter words (rude words ARE formable, never seeded)
  BANK=d.words.filter(w=>!w.starter);
  $('total').textContent=BANK.length;
  if(dict){ for(const k in dict.shelves) for(const w of dict.shelves[k]) DICT.add(w);
            DEFS=dict.defs||{}; }
  load(); startCycle(); starterGift();
}).catch(()=>{
  $('msg').textContent='Could not load ../content/words.json — run the server from the repo root';
  $('msg').className='bad';
});
</script>
</body>
</html>
