<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Vocap shareable build 2026-08-02 -->
<title>Vocap — M1 prototype (gray boxes)</title>
<style>
  /* ============================================================
     M1 = deliberately ugly. Gray boxes. If this is fun, art will
     only make it better. Everything visual here is placeholder.
     ============================================================ */
  :root{
    --bg:#2b2d31; --panel:#36393f; --box:#4a4d55; --box-lit:#6b7280;
    --glow:#e3b341; --text:#e6e6e6; --dim:#9aa0a6; --good:#7ec97e;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Thai',sans-serif;
       margin:0;display:flex;flex-direction:column;align-items:center;padding:20px 12px;gap:14px;
       max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  h1{font-size:15px;letter-spacing:3px;color:var(--dim);margin:0;font-weight:600}

  /* --- the tray: one gray box per letter slot --- */
  #tray{display:flex;gap:8px;min-height:64px;align-items:center;flex-wrap:wrap;
        justify-content:center;max-width:100%}
  .slot{width:52px;height:60px;border-radius:8px;background:var(--panel);
        display:flex;align-items:center;justify-content:center;font-size:26px;
        font-weight:700;border:2px solid transparent;text-transform:uppercase}
  .slot.filled{background:var(--box)}
  .slot.typed{background:var(--box-lit);border-color:var(--glow)}   /* highlighted while typing */
  .slot.empty{opacity:.35}

  /* --- the clue line: the learning mechanic, front and centre --- */
  #clue{min-height:24px;color:var(--glow);font-size:15px;text-align:center;
        max-width:min(640px,100%);line-height:1.6}
  #clue.spellable{text-shadow:0 0 12px var(--glow)}                 /* the "glow" from §3.6 */

  .slot.used{background:var(--box-lit);border-color:var(--glow);opacity:.55}  /* in use below */
  .slot.filled{cursor:pointer}
  .slot.filled:hover{border-color:var(--glow)}

  /* --- the word tray: where letters go to become a word --- */
  #wordtray{display:flex;gap:6px;min-height:56px;align-items:center;justify-content:center;
            background:rgba(0,0,0,.22);border-radius:10px;padding:10px 14px;
            width:min(560px,100%);flex-wrap:wrap;border:2px dashed #4a4d55}
  #wordtray.ready{border-color:var(--good);border-style:solid}
  #wordtray .wslot{width:44px;height:50px;border-radius:6px;background:var(--box-lit);
        display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
        text-transform:uppercase;cursor:pointer;border:2px solid var(--glow)}
  #wordtray .wslot.space{background:transparent;border:2px dashed #666;width:22px}
  #wordtray .hint{color:var(--dim);font-size:13px}

  /* --- submit / clear buttons (essential on touch: no keyboard, no Enter key) --- */
  #actions{display:flex;gap:10px}
  #actions button{padding:11px 26px;font-size:15px;font-weight:600;border-radius:8px}
  #submit{background:var(--good);color:#123;border-color:var(--good)}
  #submit:disabled{background:var(--panel);color:var(--dim);border-color:#555;font-weight:400}
  /* bigger touch targets on small screens */
  @media (max-width:700px){
    /* tiles scale with the screen so a full 15-slot tray always fits */
    .slot{width:min(46px,10.5vw);height:min(54px,13vw);font-size:min(22px,5.4vw);border-radius:6px}
    #tray{gap:5px;min-height:auto}
    #wordtray .wslot{width:min(40px,9.5vw);height:min(48px,12vw);font-size:min(20px,5vw)}
    #wordtray{gap:4px;padding:8px 10px}
    #actions button{padding:14px 32px;font-size:16px}
    #bar{gap:12px;font-size:12px}
    #bar button{padding:8px 12px}
    h1{font-size:13px}
    #clue{font-size:14px}
    #card{padding:14px 16px}
    #card h2{font-size:22px}
  }

  /* --- typing area (kept for the letter count) --- */
  #typed{font-size:13px;letter-spacing:2px;min-height:18px;color:var(--dim)}
  #msg{min-height:22px;color:var(--dim);font-size:14px}
  #msg.good{color:var(--good)} #msg.bad{color:#e07a7a}

  /* --- status bar --- */
  #bar{display:flex;gap:22px;color:var(--dim);font-size:13px;align-items:center;flex-wrap:wrap;justify-content:center}
  #bar b{color:var(--text)}
  button{background:var(--panel);color:var(--text);border:1px solid #555;border-radius:6px;
         padding:5px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--glow)}

  /* --- discovery card (plain, art slot reserved) --- */
  #card{display:none;background:var(--panel);border-radius:12px;padding:18px 22px;max-width:560px;
        border:1px solid #555}
  #card.show{display:block}
  #card.dict{border-style:dashed;opacity:.9}
  #card.dict h2{font-size:22px;color:var(--dim)}
  #card h2{margin:0 0 4px;font-size:26px;cursor:pointer;user-select:none}
  #card h2:after{content:' 🔊';font-size:16px;opacity:.5}
  #card .th{color:var(--glow);font-size:18px}
  #card p{margin:6px 0;font-size:14px;line-height:1.5}
  #card .meta{color:var(--dim);font-size:12px}

  /* --- found-this-cycle log --- */
  #log{font-size:13px;color:var(--dim);max-width:640px;text-align:center;line-height:1.8}
  #log span{background:var(--panel);border-radius:5px;padding:2px 8px;margin:2px}
</style>
</head>

<h1>VOCAP · M1</h1>

<div id="bar">

</div>

<div id="clue"></div>
<div id="tray"></div>

</div>

</div>

ll Creatures","phase":1,"starter":false,"rudeness":null,"definition":"An insect with colorful wings.","history":"Butterflies go through a complete metamorphosis from caterpillar to butterfly. They are important pollinators.","translations":{"th":{"word":"ผีเสื้อ","definition":"แมลงที่มีปีกสีสันสวยงาม","history":"ผีเสื้อผ่านการเปลี่ยนรูปร่างสมบูรณ์จากหนอนเป็นผีเสื้อ และเป็นแมลงผสมเกสรที่สำคัญ"}},"sentence":"A butterfly rested on my hand.","thai":"ผีเสื้อ"},{"id":"caterpillar","word":"caterpillar","letters":11,"spell":"caterpillar","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"The larval stage of a butterfly or moth.","history":"Caterpillars can eat 27,000 times their own weight before turning into butterflies.","translations":{"th":{"word":"หนอนผีเสื้อ","definition":"ระยะตัวอ่อนของผีเสื้อกลางวันหรือกลางคืน","history":"หนอนผีเสื้อกินอาหารได้ถึง 27,000 เท่าของน้ำหนักตัวก่อนกลายเป็นผีเสื้อ"}},"sentence":"The caterpillar ate the whole leaf.","thai":"หนอนผีเสื้อ"},{"id":"centipede","word":"centipede","letters":9,"spell":"centipede","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A long creature with many legs.","history":"Centipedes can have up to 354 legs. They are fast predators that eat insects.","translations":{"th":{"word":"ตะขาบ","definition":"สัตว์ลำตัวยาวที่มีขาจำนวนมาก","history":"ตะขาบมีขาได้ถึง 354 ขา เป็นนักล่าที่ว่องไวและกินแมลงเป็นอาหาร"}},"sentence":"A centipede has many legs.","thai":"ตะขาบ"},{"id":"cockroach","word":"cockroach","letters":9,"spell":"cockroach","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A fast-running insect that can survive almost anywhere.","history":"Cockroaches can live for a month without food and have been around for over 300 million years.","translations":{"th":{"word":"แมลงสาบ","definition":"แมลงที่วิ่งเร็วและอยู่รอดได้แทบทุกที่","history":"แมลงสาบอยู่ได้เป็นเดือนโดยไม่กินอาหาร และมีอยู่บนโลกมากว่า 300 ล้านปี"}},"sentence":"A cockroach ran under the fridge.","thai":"แมลงสาบ"},{"id":"cricket","word":"cricket","letters":7,"spell":"cricket","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A jumping insect known for its chirping.","history":"Crickets are considered lucky in many cultures. Their chirping is actually a mating call.","translations":{"th":{"word":"จิ้งหรีด","definition":"แมลงกระโดดที่ส่งเสียงร้อง","history":"หลายวัฒนธรรมถือว่าจิ้งหรีดเป็นสัตว์นำโชค เสียงร้องของมันคือการเรียกหาคู่"}},"sentence":"Crickets chirped all night.","thai":"จิ้งหรีด"},{"id":"dragonfly","word":"dragonfly","letters":9,"spell":"dragonfly","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A fast-flying insect with large eyes.","history":"Dragonflies were some of the first flying insects. They can fly in all directions, including backwards.","translations":{"th":{"word":"แมลงปอ","definition":"แมลงบินเร็วที่มีตาโต","history":"แมลงปอเป็นแมลงบินได้กลุ่มแรกๆ ของโลก บินได้ทุกทิศทางรวมถึงถอยหลัง"}},"sentence":"A dragonfly hovered over the pond.","thai":"แมลงปอ"},{"id":"flea","word":"flea","letters":4,"spell":"flea","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A tiny jumping parasite.","history":"Fleas can jump 150 times their own height. They are excellent at spreading between animals.","translations":{"th":{"word":"หมัด","definition":"ปรสิตตัวจิ๋วที่กระโดดได้","history":"หมัดกระโดดได้สูงถึง 150 เท่าของความสูงตัวเอง และแพร่จากสัตว์ตัวหนึ่งไปอีกตัวได้ง่าย"}},"sentence":"The dog scratched at a flea.","thai":"หมัด"},{"id":"fly","word":"fly","letters":3,"spell":"fly","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A common flying insect.","history":"Flies can taste with their feet. They are important decomposers but also spread diseases.","translations":{"th":{"word":"แมลงวัน","definition":"แมลงบินที่พบได้ทั่วไป","history":"แมลงวันรับรสด้วยเท้า มันช่วยย่อยสลายซากแต่ก็แพร่เชื้อโรคด้วย"}},"sentence":"A fly buzzed around the food.","thai":"แมลงวัน"},{"id":"grasshopper","word":"grasshopper","letters":11,"spell":"grasshopper","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A jumping insect that makes chirping sounds.","history":"Grasshoppers can jump 20 times their body length. They are a food source in some cultures.","translations":{"th":{"word":"ตั๊กแตน","definition":"แมลงกระโดดที่ส่งเสียงร้อง","history":"ตั๊กแตนกระโดดได้ไกล 20 เท่าของความยาวลำตัว และเป็นอาหารในบางวัฒนธรรม"}},"sentence":"A grasshopper jumped from the grass.","thai":"ตั๊กแตน"},{"id":"ladybug","word":"ladybug","letters":7,"spell":"ladybug","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A small red beetle with black spots.","history":"Ladybugs are beneficial insects. They eat aphids that damage plants.","translations":{"th":{"word":"เต่าทอง","definition":"ด้วงตัวเล็กสีแดงมีจุดดำ","history":"เต่าทองเป็นแมลงที่มีประโยชน์ เพราะกินเพลี้ยที่ทำลายพืช"}},"sentence":"A ladybug landed on the leaf.","thai":"เต่าทอง"},{"id":"louse","word":"louse","letters":5,"spell":"louse","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A small parasite that lives on hair or feathers.","history":"Lice have been around for millions of years. They are very common in school children.","translations":{"th":{"word":"เหา","definition":"ปรสิตตัวเล็กที่อาศัยบนเส้นผมหรือขนนก","history":"เหามีมานานหลายล้านปี และพบบ่อยมากในเด็กนักเรียน"}},"sentence":"A louse is hard to see.","thai":"เหา"},{"id":"millipede","word":"millipede","letters":9,"spell":"millipede","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A long creature with many legs that curls up when threatened.","history":"Millipedes are not insects. They are decomposers that eat dead plant material.","translations":{"th":{"word":"กิ้งกือ","definition":"สัตว์ลำตัวยาวหลายขาที่ขดตัวเมื่อถูกรบกวน","history":"กิ้งกือไม่ใช่แมลง มันเป็นผู้ย่อยสลายที่กินซากพืช"}},"sentence":"The millipede curled into a spiral.","thai":"กิ้งกือ"},{"id":"mosquito","word":"mosquito","letters":8,"spell":"mosquito","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A small flying insect that bites.","history":"Only female mosquitoes bite. They are responsible for spreading many diseases but are also an important food source for other animals.","translations":{"th":{"word":"ยุง","definition":"แมลงบินตัวเล็กที่กัดดูดเลือด","history":"มีเพียงยุงตัวเมียที่กัด ยุงแพร่โรคหลายชนิดแต่ก็เป็นอาหารสำคัญของสัตว์อื่น"}},"sentence":"A mosquito bit my ankle.","thai":"ยุง"},{"id":"moth","word":"moth","letters":4,"spell":"moth","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A nocturnal insect related to butterflies.","history":"Moths are attracted to light. Some species can fly over 100 km in a single night.","translations":{"th":{"word":"ผีเสื้อกลางคืน","definition":"แมลงกลางคืนที่เป็นญาติกับผีเสื้อ","history":"ผีเสื้อกลางคืนชอบเล่นไฟ บางชนิดบินได้ไกลกว่า 100 กิโลเมตรในคืนเดียว"}},"sentence":"A moth circled the lamp.","thai":"ผีเสื้อกลางคืน"},{"id":"praying_mantis","word":"praying mantis","letters":13,"spell":"prayingmantis","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A large insect that stands with front legs folded.","history":"Praying mantises are excellent hunters. The females sometimes eat the males after mating.","translations":{"th":{"word":"ตั๊กแตนตำข้าว","definition":"แมลงตัวใหญ่ที่ยืนพับขาหน้าเหมือนพนมมือ","history":"ตั๊กแตนตำข้าวเป็นนักล่าชั้นยอด ตัวเมียบางครั้งกินตัวผู้หลังผสมพันธุ์"}},"sentence":"The praying mantis held still for hours.","thai":"ตั๊กแตนตำข้าว"},{"id":"scorpion","word":"scorpion","letters":8,"spell":"scorpion","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A creature with a stinging tail.","history":"Scorpions can glow under ultraviolet light. Some species can live for over 20 years.","translations":{"th":{"word":"แมงป่อง","definition":"สัตว์ที่มีหางต่อยพิษ","history":"แมงป่องเรืองแสงได้ใต้แสงอัลตราไวโอเลต บางชนิดอายุยืนกว่า 20 ปี"}},"sentence":"A scorpion hid under the stone.","thai":"แมงป่อง"},{"id":"spider","word":"spider","letters":6,"spell":"spider","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"An eight-legged creature that spins webs.","history":"Spiders are not insects. They are arachnids and most are beneficial because they eat pests.","translations":{"th":{"word":"แมงมุม","definition":"สัตว์แปดขาที่ชักใยได้","history":"แมงมุมไม่ใช่แมลงแต่เป็นแมงมุม (arachnid) ส่วนใหญ่มีประโยชน์เพราะกินแมลงศัตรูพืช"}},"sentence":"The spider spun a web overnight.","thai":"แมงมุม"},{"id":"termite","word":"termite","letters":7,"spell":"termite","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A wood-eating social insect.","history":"Termites can eat wood and cause damage to buildings. They live in large colonies with a queen.","translations":{"th":{"word":"ปลวก","definition":"แมลงสังคมที่กินไม้","history":"ปลวกกินไม้และทำลายอาคารได้ อยู่รวมกันเป็นรังใหญ่ที่มีนางพญา"}},"sentence":"Termites damaged the wooden floor.","thai":"ปลวก"},{"id":"tick","word":"tick","letters":4,"spell":"tick","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A small parasite that attaches to animals.","history":"Ticks can spread diseases. They are not insects but arachnids like spiders.","translations":{"th":{"word":"เห็บ","definition":"ปรสิตตัวเล็กที่เกาะติดสัตว์","history":"เห็บแพร่โรคได้ และไม่ใช่แมลงแต่เป็นแมงเหมือนแมงมุม"}},"sentence":"Check for ticks after hiking.","thai":"เห็บ"},{"id":"worm","word":"worm","letters":4,"spell":"worm","topic":"Animals","topic2":null,"sublist":"Small Creatures","phase":1,"starter":false,"rudeness":null,"definition":"A small soft-bodied creature that lives in soil.","history":"Earthworms are nature's recyclers. They help make soil fertile by breaking down organic matter.","translations":{"th":{"word":"หนอน","definition":"สัตว์ลำตัวอ่อนนุ่มที่อยู่ในดิน","history":"ไส้เดือนคือนักรีไซเคิลของธรรมชาติ ช่วยย่อยซากอินทรีย์ทำให้ดินอุดมสมบูรณ์"}},"sentence":"Worms help the soil stay healthy.","thai":"หนอน"},{"id":"alligator","word":"alligator","letters":9,"spell":"alligator","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A large reptile similar to a crocodile.","history":"Alligators can live for over 50 years. They are found mainly in the Americas.","translations":{"th":{"word":"จระเข้อเมริกัน","definition":"สัตว์เลื้อยคลานขนาดใหญ่คล้ายจระเข้","history":"จระเข้อเมริกันอายุยืนกว่า 50 ปี พบมากในทวีปอเมริกา"}},"sentence":"An alligator has a wider snout.","thai":"จระเข้อเมริกัน"},{"id":"bear","word":"bear","letters":4,"spell":"bear","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A large furry animal.","history":"Bears can run very fast despite their size. They hibernate in winter.","translations":{"th":{"word":"หมี","definition":"สัตว์ขนปุยขนาดใหญ่","history":"หมีวิ่งเร็วมากแม้ตัวจะใหญ่ และจำศีลในฤดูหนาว"}},"sentence":"The bear searched for berries.","thai":"หมี"},{"id":"bird","word":"bird","letters":4,"spell":"bird","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudenes y":"งูบางชนิดเลี้ยงเป็นสัตว์เลี้ยงได้ เป็นสัตว์เลือดเย็นและอยู่ได้หลายสัปดาห์โดยไม่กินอาหาร"}},"sentence":"The snake slid into the grass.","thai":"งู"},{"id":"squid","word":"squid","letters":5,"spell":"squid","topic":"Animals","topic2":"Food & Drink","sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A sea creature with tentacles and ink.","history":"Squid can change color and release ink to escape predators. They are very fast swimmers.","translations":{"th":{"word":"ปลาหมึก","definition":"สัตว์ทะเลที่มีหนวดและพ่นหมึกได้","history":"ปลาหมึกเปลี่ยนสีและพ่นหมึกเพื่อหนีศัตรูได้ และว่ายน้ำเร็วมาก"}},"sentence":"Grilled squid is a beach snack.","thai":"ปลาหมึก"},{"id":"starfish","word":"starfish","letters":8,"spell":"starfish","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A sea creature with five arms.","history":"Starfish can regrow lost arms. They are not fish — they are echinoderms.","translations":{"th":{"word":"ปลาดาว","definition":"สัตว์ทะเลที่มีแขนห้าแฉก","history":"ปลาดาวงอกแขนใหม่ได้ และไม่ใช่ปลา แต่เป็นสัตว์ในกลุ่มเอไคโนเดิร์ม"}},"sentence":"A starfish clung to the rock.","thai":"ปลาดาว"},{"id":"tiger","word":"tiger","letters":5,"spell":"tiger","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A striped big cat.","history":"Tigers are the largest cat species. Each tiger has a unique stripe pattern.","translations":{"th":{"word":"เสือ","definition":"แมวใหญ่ลายทาง","history":"เสือเป็นแมวที่ตัวใหญ่ที่สุด และลายของเสือแต่ละตัวไม่ซ้ำกันเลย"}},"sentence":"A tiger's stripes are unique.","thai":"เสือ"},{"id":"turtle","word":"turtle","letters":6,"spell":"turtle","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A slow-moving reptile with a shell.","history":"Turtles are one of the oldest reptile groups. Some species can live for over 100 years.","translations":{"th":{"word":"เต่า","definition":"สัตว์เลื้อยคลานเคลื่อนที่ช้าที่มีกระดอง","history":"เต่าเป็นสัตว์เลื้อยคลานกลุ่มเก่าแก่ที่สุดกลุ่มหนึ่ง บางชนิดอายุยืนกว่า 100 ปี"}},"sentence":"The turtle moved slowly along.","thai":"เต่า"},{"id":"whale","word":"whale","letters":5,"spell":"whale","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A large ocean mammal.","history":"Blue whales are the largest animals that have ever lived. They can sing complex songs.","translations":{"th":{"word":"วาฬ","definition":"สัตว์เลี้ยงลูกด้วยนมขนาดใหญ่ในมหาสมุทร","history":"วาฬสีน้ำเงินเป็นสัตว์ที่ใหญ่ที่สุดเท่าที่เคยมีมาบนโลก และร้องเพลงที่ซับซ้อนได้"}},"sentence":"A whale surfaced near the ship.","thai":"วาฬ"},{"id":"wolf","word":"wolf","letters":4,"spell":"wolf","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A wild ancestor of the dog.","history":"Wolves live in packs and have complex social structures.","translations":{"th":{"word":"หมาป่า","definition":"บรรพบุรุษป่าของสุนัข","history":"หมาป่าอยู่รวมกันเป็นฝูงและมีโครงสร้างสังคมที่ซับซ้อน"}},"sentence":"The wolf howled at night.","thai":"หมาป่า"},{"id":"zebra","word":"zebra","letters":5,"spell":"zebra","topic":"Animals","topic2":null,"sublist":"Wild","phase":1,"starter":false,"rudeness":null,"definition":"A striped horse-like animal.","history":"No two zebras have the same stripe pattern. Their stripes help confuse predators.","translations":{"th":{"word":"ม้าลาย","definition":"สัตว์คล้ายม้าที่มีลายทาง","history":"ไม่มีม้าลายสองตัวใดที่ลายเหมือนกัน ลายของมันช่วยทำให้นักล่าสับสน"}},"sentence":"No two zebras share the same stripes.","thai":"ม้าลาย"},{"id":"apple","word":"apple","letters":5,"spell":"apple","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A round fruit with red, green, or yellow skin.","history":"Apples are one of the most cultivated fruits in the world. The saying \"an apple a day keeps the doctor away\" comes from old English health advice.","translations":{"th":{"word":"แอปเปิล","definition":"ผลไม้ทรงกลม เปลือกสีแดง เขียว หรือเหลือง","history":"แอปเปิลเป็นผลไม้ที่ปลูกมากที่สุดชนิดหนึ่งในโลก คำกล่าวที่ว่า \"กินแอปเปิลวันละผล หมอไม่ต้องมาเยือน\" มาจากคำแนะนำสุขภาพอังกฤษโบราณ"}},"sentence":"She packed an apple for lunch.","thai":"แอปเปิล"},{"id":"apricot","word":"apricot","letters":7,"spell":"apricot","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small orange fruit with a stone.","history":"The name travelled from Latin through Arabic and Spanish before reaching English.","translations":{"th":{"word":"แอปริคอต","definition":"ผลไม้สีส้มลูกเล็กที่มีเมล็ดแข็งข้างใน","history":"ชื่อของมันเดินทางผ่านภาษาละติน อาหรับ และสเปน ก่อนจะมาถึงภาษาอังกฤษ"}},"sentence":"Dried apricots make a good snack.","thai":"แอปริคอต"},{"id":"avocado","word":"avocado","letters":7,"spell":"avocado","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A green fruit with creamy flesh.","history":"Avocado is technically a berry. It is one of the few fruits that contains healthy fat.","translations":{"th":{"word":"อะโวคาโด","definition":"ผลไม้สีเขียวที่มีเนื้อครีมมี","history":"อะโวคาโดจัดเป็นผลไม้ตระกูลเบอร์รีทางพฤกษศาสตร์ และเป็นผลไม้ไม่กี่ชนิดที่มีไขมันดี"}},"sentence":"Avocado toast for breakfast.","thai":"อะโวคาโด"},{"id":"banana","word":"banana","letters":6,"spell":"banana","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A long curved yellow fruit.","history":"Bananas are technically berries. They are one of the most popular fruits globally and are a good source of potassium.","translations":{"th":{"word":"กล้วย","definition":"ผลไม้สีเหลืองรูปโค้งยาว","history":"กล้วยจัดเป็นเบอร์รีทางพฤกษศาสตร์ เป็นผลไม้ยอดนิยมทั่วโลกและมีโพแทสเซียมสูง"}},"sentence":"The banana is still green.","thai":"กล้วย"},{"id":"blackberry","word":"blackberry","letters":10,"spell":"blackberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A dark purple berry.","history":"Blackberries grow wild in many places. They are often used in pies and jams.","translations":{"th":{"word":"แบล็กเบอร์รี","definition":"เบอร์รีสีม่วงเข้ม","history":"แบล็กเบอร์รีขึ้นเองตามธรรมชาติในหลายพื้นที่ นิยมใช้ทำพายและแยม"}},"sentence":"We picked blackberries by the path.","thai":"แบล็กเบอร์รี"},{"id":"blood_orange","word":"blood orange","letters":11,"spell":"bloodorange","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"An orange with deep red flesh.","history":"Blood oranges get their color from anthocyanins. They have a raspberry-like flavor.","translations":{"th":{"word":"ส้มเลือด","definition":"ส้มที่มีเนื้อในสีแดงเข้ม","history":"สีแดงของมันมาจากสารแอนโทไซยานิน และมีรสคล้ายราสป์เบอร์รี"}},"sentence":"The blood orange had deep red flesh.","thai":"ส้มเลือด"},{"id":"blueberry","word":"blueberry","letters":9,"spell":"blueberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small blue-purple berry.","history":"Blueberries are often called a \"superfood\" because they are high in antioxidants.","translations":{"th":{"word":"บลูเบอร์รี","definition":"เบอร์รีลูกเล็กสีน้ำเงินอมม่วง","history":"บลูเบอร์รีมักถูกเรียกว่า \"ซูเปอร์ฟู้ด\" เพราะมีสารต้านอนุมูลอิสระสูง"}},"sentence":"Blueberry pancakes for breakfast.","thai":"บลูเบอร์รี"},{"id":"cantaloupe","word":"cantaloupe","letters":10,"spell":"cantaloupe","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"An orange-fleshed melon.","history":"It is named after a town near Rome where it was once grown.","translations":{"th":{"word":"แคนตาลูป","definition":"เมลอนที่มีเนื้อสีส้ม","history":"ตั้งชื่อตามเมืองใกล้กรุงโรมที่เคยเป็นแหล่งปลูก"}},"sentence":"Cantaloupe with ham is a classic.","thai":"แคนตาลูป"},{"id":"cherry","word":"cherry","letters":6,"spell":"cherry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small round red fruit with a pit.","history":"Cherries are one of the first fruits to ripen in spring. There is a famous Japanese festival for cherry blossoms.","translations":{"th":{"word":"เชอร์รี","definition":"ผลไม้กลมเล็กสีแดงที่มีเมล็ดข้างใน","history":"เชอร์รีเป็นผลไม้ชนิดแรกๆ ที่สุกในฤดูใบไม้ผลิ และมีเทศกาลชมดอกซากุระอันโด่งดังในญี่ปุ่น"}},"sentence":"A cherry sat on the cake.","thai":"เชอร์รี"},{"id":"clementine","word":"clementine","letters":10,"spell":"clementine","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A seedless small citrus fruit.","history":"It is named after the French monk who first grew it.","translations":{"th":{"word":"ส้มคลีเมนไทน์","definition":"ส้มลูกเล็กไม่มีเมล็ด","history":"ตั้งชื่อตามบาทหลวงชาวฝรั่งเศสผู้เพาะพันธุ์มันขึ้นเป็นคนแรก"}},"sentence":"She packed a clementine for lunch.","thai":"ส้มคลีเมนไทน์"},{"id":"cranberry","word":"cranberry","letters":9,"spell":"cranberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small sour red berry.","history":"Cranberries float, so farmers flood the fields to harvest them.","translations":{"th":{"word":"แครนเบอร์รี","definition":"เบอร์รีลูกเล็กสีแดงรสเปรี้ยว","history":"แครนเบอร์รีลอยน้ำได้ เกษตรกรจึงปล่อยน้ำท่วมแปลงเพื่อเก็บเกี่ยว"}},"sentence":"Cranberry sauce goes with turkey.","thai":"แครนเบอร์รี"},{"id":"date","word":"date","letters":4,"spell":"date","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A sweet brown fruit from palm trees.","history":"Dates are a major food in the Middle East. They are very high in natural sugar.","translations":{"th":{"word":"อินทผลัม","definition":"ผลไม้สีน้ำตาลรสหวานจากต้นปาล์ม","history":"อินทผลัมเป็นอาหารสำคัญในตะวันออกกลาง และมีน้ำตาลธรรมชาติสูงมาก"}},"sentence":"Dates are popular during Ramadan.","thai":"อินทผลัม"},{"id":"fig","word":"fig","letters":3,"spell":"fig","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A sweet fruit with many seeds inside.","history":"Figs are one of the oldest cultivated fruits. They are mentioned in many ancient texts.","translations":{"th":{"word":"มะเดื่อ","definition":"ผลไม้รสหวานที่มีเมล็ดเล็กจำนวนมากข้างใน","history":"มะเดื่อเป็นผลไม้ที่มนุษย์ปลูกมาเก่าแก่ที่สุดชนิดหนึ่ง และถูกกล่าวถึงในตำราโบราณมากมาย"}},"sentence":"Dried figs are very sweet.","thai":"มะเดื่อ"},{"id":"gooseberry","word":"gooseberry","letters":10,"spell":"gooseberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small tart green berry.","history":"Being 'a gooseberry' in British slang means an unwanted third person.","translations":{"th":{"word":"กูสเบอร์รี","definition":"เบอร์รีสีเขียวลูกเล็กรสเปรี้ยว","history":"ในสแลงอังกฤษ การเป็น \"กูสเบอร์รี\" หมายถึงคนที่สามที่ไม่มีใครต้องการ"}},"sentence":"Gooseberry jam is quite sharp.","thai":"กูสเบอร์รี"},{"id":"grape","word":"grape","letters":5,"spell":"grape","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"Small round fruits that grow in bunches.","history":"Grapes are used to make wine, juice, and raisins. They have been cultivated for over 6,000 years.","translations":{"th":{"word":"องุ่น","definition":"ผลไม้ลูกกลมเล็กที่ออกเป็นพวง","history":"องุ่นใช้ทำไวน์ น้ำผลไม้ และลูกเกด มนุษย์ปลูกองุ่นมากว่า 6,000 ปี"}},"sentence":"He ate a whole bunch of grapes.","thai":"องุ่น"},{"id":"grapefruit","word":"grapefruit","letters":10,"spell":"grapefruit","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A large sour citrus fruit.","history":"It is named grapefruit because it grows in bunches like grapes.","translations":{"th":{"word":"เกรปฟรุต","definition":"ผลไม้ตระกูลส้มลูกใหญ่รสเปรี้ยว","history":"ได้ชื่อว่าเกรปฟรุตเพราะออกผลเป็นพวงเหมือนองุ่น"}},"sentence":"Grapefruit juice is bitter.","thai":"เกรปฟรุต"},{"id":"honeydew","word":"honeydew","letters":8,"spell":"honeydew","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A pale green sweet melon.","history":"The name simply describes its honey-like sweetness.","translations":{"th":{"word":"แตงฮันนีดิว","definition":"เมลอนเนื้อเขียวอ่อนรสหวาน","history":"ชื่อของมันบรรยายความหวานคล้ายน้ำผึ้งตรงๆ"}},"sentence":"Honeydew is refreshing when chilled.","thai":"แตงฮันนีดิว"},{"id":"kiwi","word":"kiwi","letters":4,"spell":"kiwi","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small green fruit with brown fuzzy skin.","history":"Kiwi fruit is native to China but named after New Zealand. It is one of the most nutrient-dense fruits.","translations":{"th":{"word":"กีวี","definition":"ผลไม้เล็กสีเขียวที่มีเปลือกน้ำตาลขนฟู","history":"กีวีมีถิ่นกำเนิดในจีนแต่ตั้งชื่อตามนิวซีแลนด์ และเป็นผลไม้ที่มีสารอาหารหนาแน่นที่สุดชนิดหนึ่ง"}},"sentence":"Kiwi has bright green flesh.","thai":"กีวี"},{"id":"kumquat","word":"kumquat","letters":7,"spell":"kumquat","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small oval citrus fruit that can be eaten whole.","history":"Kumquats are unique because the skin is sweet and the flesh is sour.","translations":{"th":{"word":"ส้มจี๊ด","definition":"ผลไม้ตระกูลส้มลูกเล็กรีที่กินได้ทั้งลูก","history":"ส้มจี๊ดพิเศษตรงที่เปลือกหวานแต่เนื้อในเปรี้ยว"}},"sentence":"You can eat a kumquat whole.","thai":"ส้มจี๊ด"},{"id":"lemon","word":"lemon","letters":5,"spell":"lemon","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A sour yellow citrus fruit.","history":"Lemons are high in vitamin C. They were historically used by sailors to prevent scurvy.","translations":{"th":{"word":"เลมอน","definition":"ผลไม้ตระกูลส้มสีเหลืองรสเปรี้ยว","history":"เลมอนมีวิตามินซีสูง ในอดีตกะลาสีเรือใช้ป้องกันโรคลักปิดลักเปิด"}},"sentence":"Add lemon to the water.","thai":"เลมอน"},{"id":"lime","word":"lime","letters":4,"spell":"lime","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small green citrus fruit.","history":"Limes are smaller and more acidic than lemons. They are commonly used in Thai cooking.","translations":{"th":{"word":"มะนาว","definition":"ผลไม้ตระกูลส้มลูกเล็กสีเขียว","history":"มะนาวลูกเล็กและเปรี้ยวกว่าเลมอน และเป็นวัตถุดิบสำคัญในอาหารไทย"}},"sentence":"Squeeze lime over the soup.","thai":"มะนาว"},{"id":"mandarin","word":"mandarin","letters":8,"spell":"mandarin","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small easy-to-peel orange.","history":"Mandarins are given as gifts at Lunar New Year for good luck.","translations":{"th":{"word":"ส้มแมนดาริน","definition":"ส้มลูกเล็กที่ปอกเปลือกง่าย","history":"คนนิยมให้ส้มแมนดารินเป็นของขวัญช่วงตรุษจีนเพื่อความเป็นสิริมงคล"}},"sentence":"Mandarins are cheap in winter.","thai":"ส้มแมนดาริน"},{"id":"melon","word":"melon","letters":5,"spell":"melon","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A large sweet fruit with many varieties.","history":"Melons include watermelon, cantaloupe, and honeydew. They are mostly water.","translations":{"th":{"word":"เมลอน","definition":"ผลไม้ลูกใหญ่รสหวานที่มีหลายสายพันธุ์","history":"เมลอนรวมถึงแตงโม แคนตาลูป และฮันนีดิว ส่วนใหญ่เป็นน้ำ"}},"sentence":"Cold melon on a hot day.","thai":"เมลอน"},{"id":"mulberry","word":"mulberry","letters":8,"spell":"mulberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small dark berry from a tree.","history":"Silkworms eat only mulberry leaves.","translations":{"th":{"word":"หม่อน","definition":"เบอร์รีลูกเล็กสีเข้มจากต้นไม้","history":"หนอนไหมกินแต่ใบหม่อนเท่านั้น"}},"sentence":"Mulberries stained my fingers purple.","thai":"หม่อน"},{"id":"nectarine","word":"nectarine","letters":9,"spell":"nectarine","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A smooth-skinned peach.","history":"A nectarine is genetically a peach without fuzz.","translations":{"th":{"word":"เนคทารีน","definition":"ลูกพีชผิวเกลี้ยงไม่มีขน","history":"เนคทารีนคือลูกพีชที่ไม่มีขนโดยพันธุกรรม"}},"sentence":"The nectarine was perfectly ripe.","thai":"เนคทารีน"},{"id":"orange","word":"orange","letters":6,"spell":"orange","topic":"Fruits","topic2":"Colors & Shapes","sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A round citrus fruit with orange skin.","history":"Oranges were originally green. The color \"orange\" was named after the fruit, not the other way around.","translations":{"th":{"word":"ส้ม","definition":"ผลไม้ตระกูลส้มทรงกลมเปลือกสีส้ม","history":"เดิมทีส้มมีสีเขียว และสี \"ส้ม\" ถูกตั้งชื่อตามผลไม้ ไม่ใช่ในทางกลับกัน"}},"sentence":"I peeled an orange.","thai":"ส้ม"},{"id":"peach","word":"peach","letters":5,"spell":"peach","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A sweet fruit with fuzzy skin and a large pit.","history":"Peaches are originally from China. They symbolize long life in Chinese culture.","translations":{"th":{"word":"ลูกพีช","definition":"ผลไม้รสหวานผิวมีขนและมีเมล็ดใหญ่","history":"ลูกพีชมีถิ่นกำเนิดในจีน และเป็นสัญลักษณ์ของการมีอายุยืนในวัฒนธรรมจีน"}},"sentence":"The peach was soft and sweet.","thai":"ลูกพีช"},{"id":"pear","word":"pear","letters":4,"spell":"pear","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A sweet fruit with a thin skin and white flesh.","history":"Pears are related to apples. They are one of the oldest cultivated fruits in the world.","translations":{"th":{"word":"ลูกแพร์","definition":"ผลไม้รสหวานเปลือกบางเนื้อสีขาว","history":"ลูกแพร์เป็นญาติกับแอปเปิล และเป็นผลไม้ที่ปลูกมาเก่าแก่ที่สุดชนิดหนึ่งในโลก"}},"sentence":"I sliced a pear for her.","thai":"ลูกแพร์"},{"id":"persimmon","word":"persimmon","letters":9,"spell":"persimmon","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"An orange fruit that must be fully ripe.","history":"An unripe persimmon dries the mouth instantly.","translations":{"th":{"word":"ลูกพลับ","definition":"ผลไม้สีส้มที่ต้องสุกเต็มที่ก่อนกิน","history":"ลูกพลับที่ยังไม่สุกทำให้ปากฝาดทันที"}},"sentence":"This persimmon is soft and sweet.","thai":"ลูกพลับ"},{"id":"plum","word":"plum","letters":4,"spell":"plum","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small sweet fruit with smooth skin and a pit.","history":"Plums can be eaten fresh or dried into prunes. They are used in many desserts.","translations":{"th":{"word":"ลูกพลัม","definition":"ผลไม้รสหวานลูกเล็ก ผิวเรียบ มีเมล็ด","history":"ลูกพลัมกินสดหรือตากแห้งเป็นลูกพรุนก็ได้ และใช้ทำของหวานหลายชนิด"}},"sentence":"This plum is very juicy.","thai":"ลูกพลัม"},{"id":"pomegranate","word":"pomegranate","letters":11,"spell":"pomegranate","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A fruit with many red seeds inside.","history":"Pomegranates are known as a symbol of fertility in many cultures.","translations":{"th":{"word":"ทับทิม","definition":"ผลไม้ที่มีเมล็ดสีแดงจำนวนมากข้างใน","history":"ทับทิมเป็นสัญลักษณ์ของความอุดมสมบูรณ์ในหลายวัฒนธรรม"}},"sentence":"Pomegranate seeds look like jewels.","thai":"ทับทิม"},{"id":"quince","word":"quince","letters":6,"spell":"quince","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A hard yellow fruit usually cooked.","history":"Quince is too hard to eat raw, so it is nearly always cooked.","translations":{"th":{"word":"ควินซ์","definition":"ผลไม้สีเหลืองเนื้อแข็งที่มักต้องปรุงสุก","history":"ควินซ์แข็งเกินกว่าจะกินสด จึงเกือบทั้งหมดถูกนำไปปรุงสุก"}},"sentence":"Quince jelly takes hours to make.","thai":"ควินซ์"},{"id":"raspberry","word":"raspberry","letters":9,"spell":"raspberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A small red berry made of many tiny parts.","history":"Raspberries are related to roses. They are very fragile and do not last long after picking.","translations":{"th":{"word":"ราสป์เบอร์รี","definition":"เบอร์รีสีแดงลูกเล็กที่ประกอบด้วยเม็ดเล็กๆ จำนวนมาก","history":"ราสป์เบอร์รีเป็นญาติกับกุหลาบ ผลบอบบางมากและเก็บไว้ได้ไม่นานหลังเก็บเกี่ยว"}},"sentence":"The raspberry tasted tart.","thai":"ราสป์เบอร์รี"},{"id":"strawberry","word":"strawberry","letters":10,"spell":"strawberry","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A red fruit with seeds on the outside.","history":"Strawberries are not true berries. They belong to the rose family.","translations":{"th":{"word":"สตรอว์เบอร์รี","definition":"ผลไม้สีแดงที่มีเมล็ดอยู่ด้านนอก","history":"สตรอว์เบอร์รีไม่ใช่เบอร์รีแท้ทางพฤกษศาสตร์ แต่อยู่ในวงศ์กุหลาบ"}},"sentence":"Strawberry jam on toast.","thai":"สตรอว์เบอร์รี"},{"id":"tangelo","word":"tangelo","letters":7,"spell":"tangelo","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A hybrid of tangerine and pomelo.","history":"Tangelos are easy to peel and very juicy. They were developed in the early 20th century.","translations":{"th":{"word":"แทนเจโล","definition":"ลูกผสมระหว่างส้มแทนเจอรีนกับส้มโอ","history":"แทนเจโลปอกง่ายและฉ่ำน้ำมาก ถูกพัฒนาขึ้นในช่วงต้นศตวรรษที่ 20"}},"sentence":"A tangelo is easy to peel.","thai":"แทนเจโล"},{"id":"ugli_fruit","word":"ugli fruit","letters":9,"spell":"uglifruit","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A large citrus fruit with bumpy green-yellow skin.","history":"Ugli fruit is a Jamaican hybrid. It is sweet and less acidic than grapefruit.","translations":{"th":{"word":"อักลี่ฟรุต","definition":"ผลไม้ตระกูลส้มลูกใหญ่ เปลือกขรุขระสีเขียวอมเหลือง","history":"อักลี่ฟรุตเป็นลูกผสมจากจาเมกา รสหวานและเปรี้ยวน้อยกว่าเกรปฟรุต"}},"sentence":"The ugli fruit looks rough but tastes sweet.","thai":"อักลี่ฟรุต"},{"id":"watermelon","word":"watermelon","letters":10,"spell":"watermelon","topic":"Fruits","topic2":null,"sublist":"Common","phase":1,"starter":false,"rudeness":null,"definition":"A large green fruit with red flesh.","history":"Watermelon is 92% water. It is one of the most refreshing summer fruits.","translations":{"th":{"word":"แตงโม","definition":"ผลไม้ลูกใหญ่เปลือกเขียวเนื้อแดง","history":"แตงโมมีน้ำถึง 92% เป็นผลไม้คลายร้อนที่สดชื่นที่สุดชนิดหนึ่ง"}},"sentence":"Watermelon is mostly water.","thai":"แตงโม"},{"id":"abiu","word":"abiu","letters":4,"spell":"abiu","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A yellow round fruit with sweet caramel-like flesh.","history":"Abiu is native to the Amazon. It has a texture similar to caramel custard.","translations":{"th":{"word":"อาบิว","definition":"ผลไม้ทรงกลมสีเหลือง เนื้อหวานคล้ายคาราเมล","history":"อาบิวมีถิ่นกำเนิดในแอมะซอน เนื้อสัมผัสคล้ายคาราเมลคัสตาร์ด"}},"sentence":"Abiu flesh is clear and jelly-like.","thai":"อาบิว"},{"id":"acerola","word":"acerola","letters":7,"spell":"acerola","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A small cherry-like fruit rich in vitamin C.","history":"Acerola holds far more vitamin C than an orange.","translations":{"th":{"word":"อะเซโรลา","definition":"ผลไม้ลูกเล็กคล้ายเชอร์รีที่มีวิตามินซีสูง","history":"อะเซโรลามีวิตามินซีสูงกว่าส้มมาก"}},"sentence":"Acerola juice is very tart.","thai":"อะเซโรลา"},{"id":"ackee","word":"ackee","letters":5,"spell":"ackee","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A red fruit with yellow flesh that is poisonous if not prepared correctly.","history":"Ackee is the national fruit of Jamaica. It is usually eaten with saltfish.","translations":{"th":{"word":"แอกกี้","definition":"ผลไม้สีแดงเนื้อเหลืองที่เป็นพิษหากปรุงไม่ถูกวิธี","history":"แอกกี้เป็นผลไม้ประจำชาติจาเมกา นิยมกินคู่กับปลาเค็ม"}},"sentence":"Ackee must be ripe before eating.","thai":"แอกกี้"},{"id":"atemoya","word":"atemoya","letters":7,"spell":"atemoya","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A green fruit with sweet creamy flesh.","history":"Atemoya is a hybrid of cherimoya and sugar apple. It has a very creamy texture.","translations":{"th":{"word":"อะเทโมยา","definition":"ผลไม้สีเขียวเนื้อครีมรสหวาน","history":"อะเทโมยาเป็นลูกผสมระหว่างเชริโมยากับน้อยหน่า เนื้อครีมมากๆ"}},"sentence":"Atemoya is a hybrid fruit.","thai":"อะเทโมยา"},{"id":"baobab_fruit","word":"baobab fruit","letters":11,"spell":"baobabfruit","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A large fruit with powdery pulp inside a hard shell.","history":"Baobab is known as the \"tree of life\" in Africa. The pulp is very high in vitamin C.","translations":{"th":{"word":"ผลเบาบับ","definition":"ผลไม้ลูกใหญ่ที่มีเนื้อเป็นผงอยู่ในเปลือกแข็ง","history":"เบาบับได้ฉายาว่า \"ต้นไม้แห่งชีวิต\" ในแอฟริกา เนื้อผงมีวิตามินซีสูงมาก"}},"sentence":"Baobab fruit powder is very sour.","thai":"ผลเบาบับ"},{"id":"black_sapote","word":"black sapote","letters":11,"spell":"blacksapote","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A green fruit with chocolate-like black pudding flesh.","history":"Black sapote is known as \"chocolate pudding fruit\". It tastes like chocolate mousse when ripe.","translations":{"th":{"word":"ซาโปเตดำ","definition":"ผลไม้สีเขียวที่มีเนื้อสีดำคล้ายพุดดิ้งช็อกโกแลต","history":"ซาโปเตดำได้ฉายาว่า \"ผลไม้พุดดิ้งช็อกโกแลต\" เมื่อสุกจะรสคล้ายช็อกโกแลตมูส"}},"sentence":"Black sapote is called chocolate pudding fruit.","thai":"ซาโปเตดำ"},{"id":"buddha_s_hand","word":"buddha's hand","letters":11,"spell":"buddhashand","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A yellow citrus fruit that looks like fingers.","history":"Buddha's hand is used mainly for its fragrant rind in perfumes and cooking. It has no juice or pulp.","translations":{"th":{"word":"ส้มมือ","definition":"ผลไม้ตระกูลส้มสีเหลืองที่มีรูปร่างเหมือนนิ้วมือ","history":"ส้มมือใช้ประโยชน์จากเปลือกหอมเป็นหลักในน้ำหอมและการปรุงอาหาร ไม่มีน้ำและเนื้อ"}},"sentence":"Buddha's hand is used mainly for its scent.","thai":"ส้มมือ"},{"id":"canistel","word":"canistel","letters":8,"spell":"canistel","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A yellow fruit with sweet creamy flesh.","history":"Canistel is also called egg fruit because the flesh looks like egg yolk. It has a sweet, pumpkin-like taste.","translations":{"th":{"word":"คานิสเทล","definition":"ผลไม้สีเหลืองเนื้อครีมรสหวาน","history":"คานิสเทลถูกเรียกว่าผลไม้ไข่เพราะเนื้อดูเหมือนไข่แดง รสหวานคล้ายฟักทอง"}},"sentence":"Canistel has a dry, custard-like texture.","thai":"คานิสเทล"},{"id":"cherimoya","word":"cherimoya","letters":9,"spell":"cherimoya","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A green heart-shaped fruit with creamy white flesh.","history":"Cherimoya is also called custard apple in some places. It is known for its sweet custard-like texture.","translations":{"th":{"word":" ng.","thai":"พุทรา"},{"id":"mamey_sapote","word":"mamey sapote","letters":11,"spell":"mameysapote","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A large brown fruit with sweet orange flesh.","history":"Mamey sapote is native to Central America. It has a sweet potato-like texture when ripe.","translations":{"th":{"word":"มาเมย์ซาโปเต","definition":"ผลไม้สีน้ำตาลลูกใหญ่ที่มีเนื้อสีส้มรสหวาน","history":"มาเมย์ซาโปเตมีถิ่นกำเนิดในอเมริกากลาง เมื่อสุกจะมีเนื้อสัมผัสคล้ายมันเทศ"}},"sentence":"Mamey sapote makes a rich milkshake.","thai":"มาเมย์ซาโปเต"},{"id":"marula","word":"marula","letters":6,"spell":"marula","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A yellow fruit with white flesh used to make Amarula liqueur.","history":"Marula is famous in Africa. Elephants are known to eat the fermented fruit and become intoxicated.","translations":{"th":{"word":"มารูลา","definition":"ผลไม้สีเหลืองเนื้อขาวที่ใช้ทำเหล้าอามารูล่า","history":"มารูลาโด่งดังในแอฟริกา และมีเรื่องเล่าว่าช้างกินผลที่หมักแล้วจนเมา"}},"sentence":"Elephants love ripe marula fruit.","thai":"มารูลา"},{"id":"miracle_fruit","word":"miracle fruit","letters":12,"spell":"miraclefruit","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A small red berry that makes sour foods taste sweet.","history":"Miracle fruit contains a protein that temporarily changes how your taste buds perceive sourness.","translations":{"th":{"word":"ผลไม้มหัศจรรย์","definition":"เบอร์รีสีแดงลูกเล็กที่ทำให้อาหารเปรี้ยวกลายเป็นหวาน","history":"ผลไม้มหัศจรรย์มีโปรตีนที่เปลี่ยนการรับรสเปรี้ยวของลิ้นชั่วคราว"}},"sentence":"Miracle fruit makes lemons taste sweet.","thai":"ผลไม้มหัศจรรย์"},{"id":"white_sapote","word":"white sapote","letters":11,"spell":"whitesapote","topic":"Fruits","topic2":null,"sublist":"Exotic","phase":1,"starter":false,"rudeness":null,"definition":"A g ":"mangosteen","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A purple fruit with sweet white segments inside and a thick rind.","history":"Mangosteen is often called the \"queen of fruits\". It is highly prized in Southeast Asia and is known for its delicate sweet-sour taste.","translations":{"th":{"word":"มังคุด","definition":"ผลไม้สีม่วงที่มีเนื้อขาวหวานเป็นกลีบและเปลือกหนา","history":"มังคุดมักถูกเรียกว่า \"ราชินีแห่งผลไม้\" เป็นที่นิยมอย่างสูงในเอเชียตะวันออกเฉียงใต้ด้วยรสหวานอมเปรี้ยวละมุน"}},"sentence":"Mangosteen is called the queen of fruit.","thai":"มังคุด"},{"id":"papaya","word":"papaya","letters":6,"spell":"papaya","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A large tropical fruit with orange flesh.","history":"Papaya contains an enzyme that helps digest protein. It is very popular in Southeast Asia.","translations":{"th":{"word":"มะละกอ","definition":"ผลไม้เขตร้อนลูกใหญ่เนื้อสีส้ม","history":"มะละกอมีเอนไซม์ที่ช่วยย่อยโปรตีน และเป็นที่นิยมมากในเอเชียตะวันออกเฉียงใต้"}},"sentence":"Green papaya salad is spicy.","thai":"มะละกอ"},{"id":"passion_fruit","word":"passion fruit","letters":12,"spell":"passionfruit","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A round fruit with tangy pulp and seeds.","history":"Passion fruit is named because its flower was thought to represent the passion of Christ.","translations":{"th":{"word":"เสาวรส","definition":"ผลไม้ทรงกลมที่มีเนื้อและเมล็ดรสเปรี้ยวจัด","history":"เสาวรสได้ชื่อมาจากดอกของมันที่เชื่อกันว่าสื่อถึงความทุกข์ทรมานของพระเยซู"}},"sentence":"Passion fruit juice is very sour.","thai":"เสาวรส"},{"id":"pineapple","word":"pineapple","letters":9,"spell":"pineapple","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A large tropical fruit with spiky skin.","history":"Pineapples ี่แปลว่า \"ขน\" เพราะเปลือกมีขน เป็นญาติใกล้ชิดกับลิ้นจี่และนิยมมากในเอเชียตะวันออกเฉียงใต้"}},"sentence":"Rambutan is covered in soft spines.","thai":"เงาะ"},{"id":"rose_apple","word":"rose apple","letters":9,"spell":"roseapple","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A bell-shaped fruit with crisp white flesh and a rose scent.","history":"Rose apple has a delicate rose scent. It is popular in Southeast Asia and is often eaten fresh.","translations":{"th":{"word":"ชมพู่","definition":"ผลไม้ทรงระฆัง เนื้อขาวกรอบ มีกลิ่นกุหลาบ","history":"ชมพู่มีกลิ่นกุหลาบอ่อนๆ นิยมในเอเชียตะวันออกเฉียงใต้และมักกินสด"}},"sentence":"Rose apple is crisp and watery.","thai":"ชมพู่"},{"id":"salak","word":"salak","letters":5,"spell":"salak","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A small fruit with brown snake-like skin and crisp white flesh.","history":"Salak is also called snake fruit. It has a crunchy texture and a sweet-sour taste.","translations":{"th":{"word":"สละ","definition":"ผลไม้ลูกเล็กเปลือกสีน้ำตาลคล้ายเกล็ดงู เนื้อขาวกรอบ","history":"สละมีอีกชื่อว่าผลไม้งู เนื้อกรอบและมีรสหวานอมเปรี้ยว"}},"sentence":"Salak skin looks like snake scales.","thai":"สละ"},{"id":"santol","word":"santol","letters":6,"spell":"santol","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A round fruit with thick skin and sweet-sour pulp.","history":"Santol is also called cotton fruit. The pulp is often eaten with salt or made into jam.","translations":{"th":{"word":"กระท้อน","definition":"ผลไม้ทรงกลมเปลือกหนา เนื้อรสหวานอมเปรี้ยว","history":"กระท้อนมีอีกชื่อว่าผลไม้ฝ้าย นิยมกินกับเกลือหรือทำแยม"}},"sentence":"Santol is often eaten with salt.","thai":"กระท้อน"},{"id":"sapodilla","word":"sapodilla","letters":9,"spell":"sapodilla","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A brown fruit with sweet grainy flesh.","history":"Sapodilla is also called chikoo. It is known for its sweet caramel-like flavor.","translations":{"th":{"word":"ละมุด","definition":"ผลไม้สีน้ำตาลที่มีเนื้อหวานสัมผัสเป็นทราย","history":"ละมุดมีอีกชื่อว่าชิกู ขึ้นชื่อเรื่องรสหวานคล้ายคาราเมล"}},"sentence":"Sapodilla tastes like brown sugar.","thai":"ละมุด"},{"id":"soursop","word":"soursop","letters":7,"spell":"soursop","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A large green fruit with white fleshy pulp and black seeds.","history":"Soursop is also called guanabana. It has a sweet and sour taste and is often used in drinks and desserts in tropical countries.","translations":{"th":{"word":"ทุเรียนเทศ","definition":"ผลไม้สีเขียวลูกใหญ่ เนื้อขาวนุ่ม มีเมล็ดดำ","history":"ทุเรียนเทศมีอีกชื่อว่ากัวนาบานา รสหวานอมเปรี้ยว นิยมทำเครื่องดื่มและของหวานในเขตร้อน"}},"sentence":"Soursop juice is tangy and sweet.","thai":"ทุเรียนเทศ"},{"id":"starfruit","word":"starfruit","letters":9,"spell":"starfruit","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A yellow fruit with a star shape when cut and a sweet-sour taste.","history":"Starfruit is also called carambola. It is one of the few fruits that is shaped like a star when sliced.","translations":{"th":{"word":"มะเฟือง","definition":"ผลไม้สีเหลืองที่หั่นแล้วเป็นรูปดาว รสหวานอมเปรี้ยว","history":"มะเฟืองมีอีกชื่อว่าคารัมโบลา เป็นผลไม้ไม่กี่ชนิดที่หั่นแล้วเป็นรูปดาว"}},"sentence":"Starfruit slices look like stars.","thai":"มะเฟือง"},{"id":"tamarind","word":"tamarind","letters":8,"spell":"tamarind","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A brown pod with sweet-sour pulp inside.","history":"Tamarind is widely used in Thai, Indian, and Mexican cooking for its unique sweet-sour taste. It is also used to make candy and drinks.","translations":{"th":{"word":"มะขาม","definition":"ฝักสีน้ำตาลที่มีเนื้อรสหวานอมเปรี้ยวข้างใน","history":"มะขามใช้กันแพร่หลายในอาหารไทย อินเดีย และเม็กซิโก ด้วยรสหวานอมเปรี้ยวเฉพาะตัว และยังใช้ทำขนมและเครื่องดื่ม"}},"sentence":"Tamarind gives pad thai its sourness.","thai":"มะขาม"},{"id":"yuzu","word":"yuzu","letters":4,"spell":"yuzu","topic":"Fruits","topic2":null,"sublist":"Tropical","phase":1,"starter":false,"rudeness":null,"definition":"A yellow citrus fruit with strong aromatic flavor.","history":"Yuzu is highly prized in Japanese cuisine for its rind and juice. It has a complex lemon-lime-grapefruit scent.","translations":{"th":{"word":"ส้มยูซุ","definition":"ผลไม้ตระกูลส้มสีเหลืองที่มีกลิ่นหอมแรง","history":"ยูซุเป็นที่นิยมอย่างสูงในอาหารญี่ปุ่นทั้งเปลือกและน้ำ มีกลิ่นซับซ้อนคล้ายเลมอน มะนาว และเกรปฟรุตรวมกัน"}},"sentence":"Yuzu peel is used in Japanese cooking.","thai":"ส้มยูซุ"},{"id":"after","word":"after","letters":5,"spell":"after","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Later than.","history":"\"After\" is the opposite of \"before\" and is very common in storytelling.","translations":{"th":{"word":"หลังจาก","definition":"หลังจาก (เวลาถัดมา)","history":"\"After\" เป็นคำตรงข้ามกับ \"before\" และพบบ่อยมากในการเล่าเรื่อง"}},"sentence":"We ate after the film.","thai":"หลังจาก"},{"id":"again","word":"again","letters":5,"spell":"again","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"One more time.","history":"\"Again\" is one of the most common adverbs in spoken English.","translations":{"th":{"word":"อีกครั้ง","definition":"อีกครั้ง","history":"\"Again\" เป็นคำวิเศษณ์ที่ใช้บ่อยที่สุดคำหนึ่งในภาษาพูด"}},"sentence":"Please say that again.","thai":"อีกครั้ง"},{"id":"all","word":"all","letters":3,"spell":"all","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"The complete amount or every one.","history":"\"All\" is one of the oldest words in the English language.","translations":{"th":{"word":"ทั้งหมด","definition":"ทั้งหมด ทุกสิ่งหรือทุกคน","history":"\"All\" เป็นคำที่เก่าแก่ที่สุดคำหนึ่งในภาษาอังกฤษ"}},"sentence":"All the seats are taken.","thai":"ทั้งหมด"},{"id":"always","word":"always","letters":6,"spell":"always","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"All the time.","history":"\"Always\" is the strongest way to say something happens every time.","translations":{"th":{"word":"เสมอ","definition":"เสมอ ตลอดเวลา","history":"\"Always\" เป็นวิธีที่หนักแน่นที่สุดในการบอกว่าบางสิ่งเกิดขึ้นทุกครั้ง"}},"sentence":"He always wakes up early.","thai":"เสมอ"},{"id":"ask","word":"ask","letters":3,"spell":"ask","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Request or question.","history":"'Ask' covers both questions and requests, which confuses many learners.","translations":{"th":{"word":"ถาม","definition":"ถาม หรือ ขอร้อง","history":"\"Ask\" ใช้ได้ทั้งการถามและการขอร้อง ซึ่งทำให้ผู้เรียนหลายคนสับสน"}},"sentence":"May I ask a question?","thai":"ถาม"},{"id":"because","word":"because","letters":7,"spell":"because","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Reason.","history":"The full original form was \"by cause\". People shortened it over hundreds of years to the word we use today.","translations":{"th":{"word":"เพราะ","definition":"เพราะ (บอกเหตุผล)","history":"รูปเดิมของมันคือ \"by cause\" คนย่อลงเรื่อยๆ ตลอดหลายร้อยปีจนกลายเป็นคำที่เราใช้ทุกวันนี้"}},"sentence":"I stayed because of the rain.","thai":"เพราะ"},{"id":"before","word":"before","letters":6,"spell":"before","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Earlier than.","history":"\"Before\" is used for time and order.","translations":{"th":{"word":"ก่อน","definition":"ก่อน (เวลาก่อนหน้า)","history":"\"Before\" ใช้กับทั้งเวลาและลำดับ"}},"sentence":"Wash your hands before eating.","thai":"ก่อน"},{"id":"big","word":"big","letters":3,"spell":"big","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Large in size.","history":"'Big' is casual; 'large' sounds more formal.","translations":{"th":{"word":"ใหญ่","definition":"ใหญ่ (ขนาดโต)","history":"\"Big\" ให้ความรู้สึกลำลอง ส่วน \"large\" ฟังดูเป็นทางการกว่า"}},"sentence":"That is a big dog.","thai":"ใหญ่"},{"id":"but","word":"but","letters":3,"spell":"but","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Used to show contrast.","history":"\"But\" is one of the most common connecting words in spoken English and is very useful for polite disagreement.","translations":{"th":{"word":"แต่","definition":"แต่ (ใช้แสดงความขัดแย้ง)","history":"\"But\" เป็นคำเชื่อมที่พบบ่อยที่สุดคำหนึ่งในภาษาพูด และมีประโยชน์มากในการโต้แย้งอย่างสุภาพ"}},"sentence":"I tried, but it failed.","thai":"แต่"},{"id":"buy","word":"buy","letters":3,"spell":"buy","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Get something by paying.","history":"'Buy' can also mean to believe something: 'I don't buy that story'.","translations":{"th":{"word":"ซื้อ","definition":"ซื้อ (ได้มาโดยการจ่ายเงิน)","history":"\"Buy\" ยังหมายถึงการเชื่อได้ด้วย เช่น \"I don't buy that story\" (ฉันไม่เชื่อเรื่องนั้น)"}},"sentence":"I want to buy a ticket.","thai":"ซื้อ"},{"id":"can","word":"can","letters":3,"spell":"can","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Ability or permission.","history":"\"Can\" originally meant \"to know\" in Old English. Over time it changed to mean ability (\"I can do it\").","translations":{"th":{"word":"สามารถ","definition":"สามารถ (ความสามารถหรือการอนุญาต)","history":"เดิมที \"can\" แปลว่า \"รู้\" ในภาษาอังกฤษเก่า ต่อมาเปลี่ยนมาหมายถึงความสามารถ"}},"sentence":"I can swim well.","thai":"สามารถ"},{"id":"close","word":"close","letters":5,"spell":"close","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Shut something.","history":"The verb 'close' and the adjective 'close' (near) sound different.","translations":{"th":{"word":"ปิด","definition":"ปิด","history":"กริยา close (ปิด) กับคำคุณศัพท์ close (ใกล้) ออกเสียงต่างกัน"}},"sentence":"Close the door behind you.","thai":"ปิด"},{"id":"come","word":"come","letters":4,"spell":"come","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Move toward the speaker.","history":"\"Come\" is the opposite of \"go\" and is used when inviting someone closer.","translations":{"th":{"word":"มา","definition":"มา (เคลื่อนที่เข้าหาผู้พูด)","history":"\"Come\" เป็นคำตรงข้ามกับ \"go\" และใช้เวลาชวนใครสักคนให้เข้ามาใกล้"}},"sentence":"Come here, please.","thai":"มา"},{"id":"day","word":"day","letters":3,"spell":"day","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"A period of 24 hours.","history":"\"Day\" comes from an ancient root that also gave us the word \"dawn\".","translations":{"th":{"word":"วัน","definition":"วัน (ช่วงเวลา 24 ชั่วโมง)","history":"\"Day\" มาจากรากศัพท์โบราณเดียวกับคำว่า \"dawn\" (รุ่งอรุณ)"}},"sentence":"Have a nice day.","thai":"วัน"},{"id":"did","word":"did","letters":3,"spell":"did","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Past tense of do.","history":"\"Did\" is used to make past questions and negatives in English.","translations":{"th":{"word":"ได้ทำ","definition":"ได้ทำ (รูปอดีตของ do)","history":"\"Did\" ใช้สร้างประโยคคำถามและปฏิเสธในอดีต"}},"sentence":"I did my best.","thai":"ได้ทำ"},{"id":"different","word":"different","letters":9,"spell":"different","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Not the same.","history":"\"Different\" is essential for describing variety.","translations":{"th":{"word":"แตกต่าง","definition":"แตกต่าง ไม่เหมือนกัน","history":"\"Different\" จำเป็นมากในการบรรยายความหลากหลาย"}},"sentence":"Their answers were different.","thai":"แตกต่าง"},{"id":"does","word":"does","letters":4,"spell":"does","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Perform an action (he/she/it).","history":"\"Does\" is the helper form for he, she, or it in questions and negatives.","translations":{"th":{"word":"ทำ","definition":"ทำ (ใช้กับ he/she/it)","history":"\"Does\" เป็นรูปกริยาช่วยสำหรับ he, she หรือ it ในประโยคคำถามและปฏิเสธ"}},"sentence":"He does the dishes daily.","thai":"ทำ"},{"id":"drink","word":"drink","letters":5,"spell":"drink","topic":"High-Frequency / Core","topic2":"Food & Drink","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Swallow liquid.","history":"'Drink' alone often implies alcohol in casual English.","translations":{"th":{"word":"ดื่ม","definition":"ดื่ม (กลืนของเหลว)","history":"การพูดว่า drink เฉยๆ ในภาษาอังกฤษลำลองมักหมายถึงการดื่มเหล้า"}},"sentence":"Drink more water today.","thai":"ดื่ม"},{"id":"during","word":"during","letters":6,"spell":"during","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"While something happens.","history":"\"During\" is used to talk about time periods.","translations":{"th":{"word":"ระหว่าง","definition":"ระหว่าง (ขณะที่บางสิ่งเกิดขึ้น)","history":"\"During\" ใช้พูดถึงช่วงเวลา"}},"sentence":"It rained during the night.","thai":"ระหว่าง"},{"id":"easy","word":"easy","letters":4,"spell":"easy","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Not difficult.","history":"'Easy' comes from an old French word meaning at rest.","translations":{"th":{"word":"ง่าย","definition":"ง่าย ไม่ยาก","history":"\"Easy\" มาจากคำภาษาฝรั่งเศสเก่าที่แปลว่าการพักผ่อน"}},"sentence":"The test was easy.","thai":"ง่าย"},{"id":"eat","word":"eat","letters":3,"spell":"eat","topic":"High-Frequency / Core","topic2":"Food & Drink","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Put food in your mouth.","history":"'Eat' becomes 'ate' and 'eaten' — an irregular pattern over a thousand years old.","translations":{"th":{"word":"กิน","definition":"กิน (นำอาหารเข้าปาก)","history":"\"Eat\" เปลี่ยนเป็น \"ate\" และ \"eaten\" ซึ่งเป็นรูปผิดปกติที่ใช้มากว่าพันปี"}},"sentence":"We eat dinner at seven.","thai":"กิน"},{"id":"even","word":"even","letters":4,"spell":"even","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Used to show surprise.","history":"\"Even\" adds emphasis and surprise in sentences.","translations":{"th":{"word":"แม้แต่","definition":"แม้แต่ (ใช้แสดงความประหลาดใจ)","history":"\"Even\" ช่วยเพิ่มน้ำหนักและความประหลาดใจให้ประโยค"}},"sentence":"Even the teacher laughed.","thai":"แม้แต่"},{"id":"feel","word":"feel","letters":4,"spell":"feel","topic":"High-Frequency / Core","topic2":"Emotions & Feelings","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Experience an emotion or touch.","history":"'Feel' covers both physical touch and inner emotion.","translations":{"th":{"word":"รู้สึก","definition":"รู้สึก (ทั้งทางกายและอารมณ์)","history":"\"Feel\" ครอบคลุมทั้งการสัมผัสทางกายและความรู้สึกภายใน"}},"sentence":"I feel much better today.","thai":"รู้สึก"},{"id":"find","word":"find","letters":4,"spell":"find","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Discover or locate.","history":"'Find' can mean both discovering an object and forming an opinion.","translations":{"th":{"word":"หา","definition":"หา พบ หรือค้นเจอ","history":"\"Find\" หมายถึงทั้งการค้นพบสิ่งของและการเกิดความคิดเห็น"}},"sentence":"I can't find my phone.","thai":"หา"},{"id":"first","word":"first","letters":5,"spell":"first","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Coming before all others.","history":"\"First\" is the ordinal number for 1.","translations":{"th":{"word":"แรก","definition":"แรก (มาก่อนสิ่งอื่นทั้งหมด)","history":"\"First\" คือเลขลำดับของ 1"}},"sentence":"He was the first to arrive.","thai":"แรก"},{"id":"for","word":"for","letters":3,"spell":"for","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Purpose or benefit.","history":"\"For\" is used in many common phrases like \"for you\" and \"for example\".","translations":{"th":{"word":"สำหรับ","definition":"สำหรับ (จุดประสงค์หรือผู้รับประโยชน์)","history":"\"For\" ใช้ในวลีทั่วไปมากมาย เช่น \"for you\" และ \"for example\""}},"sentence":"This gift is for you.","thai":"สำหรับ"},{"id":"from","word":"from","letters":4,"spell":"from","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Origin or starting point.","history":"\"From\" is used to talk about where something comes from or begins.","translations":{"th":{"word":"จาก","definition":"จาก (จุดเริ่มต้นหรือแหล่งที่มา)","history":"\"From\" ใช้พูดถึงที่มาหรือจุดเริ่มต้นของบางสิ่ง"}},"sentence":"She is from Bangkok.","thai":"จาก"},{"id":"get","word":"get","letters":3,"spell":"get","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Obtain or become.","history":"\"Get\" is one of the most useful and flexible verbs in English. It can mean many different things depending on context.","translations":{"th":{"word":"ได้รับ","definition":"ได้รับ หรือ กลายเป็น","history":"\"Get\" เป็นกริยาที่มีประโยชน์และยืดหยุ่นที่สุดคำหนึ่งในภาษาอังกฤษ ความหมายเปลี่ยนไปตามบริบท"}},"sentence":"I get home at six.","thai":"ได้รับ"},{"id":"give","word":"give","letters":4,"spell":"give","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Hand something to someone.","history":"'Give' appears in hundreds of phrases like 'give up' and 'give in'.","translations":{"th":{"word":"ให้","definition":"ให้ (ส่งบางสิ่งแก่ใครบางคน)","history":"\"Give\" ปรากฏในสำนวนนับร้อย เช่น \"give up\" (ยอมแพ้) และ \"give in\" (ยอมตาม)"}},"sentence":"Give me a minute.","thai":"ให้"},{"id":"good","word":"good","letters":4,"spell":"good","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Positive or high quality.","history":"\"Good\" comes from an Old English word meaning \"fitting\" or \"suitable\".","translations":{"th":{"word":"ดี","definition":"ดี มีคุณภาพ","history":"\"Good\" มาจากคำภาษาอังกฤษเก่าที่แปลว่า \"เหมาะสม\" หรือ \"พอเหมาะ\""}},"sentence":"That was a good film.","thai":"ดี"},{"id":"had","word":"had","letters":3,"spell":"had","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Past tense of have.","history":"\"Had\" is one of the most common past tense verbs in storytelling.","translations":{"th":{"word":"มี (อดีต)","definition":"มี (รูปอดีตของ have)","history":"\"Had\" เป็นกริยารูปอดีตที่พบบ่อยที่สุดคำหนึ่งในการเล่าเรื่อง"}},"sentence":"We had lunch already.","thai":"มี (อดีต)"},{"id":"hard","word":"hard","letters":4,"spell":"hard","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Difficult, or firm to touch.","history":"'Hard' means both difficult and solid — context decides.","translations":{"th":{"word":"ยาก","definition":"ยาก หรือ แข็ง","history":"\"Hard\" หมายถึงทั้งยากและแข็ง ต้องดูบริบทเป็นหลัก"}},"sentence":"This question is hard.","thai":"ยาก"},{"id":"has","word":"has","letters":3,"spell":"has","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Possess (he/she/it).","history":"\"Has\" is the form used with he, she, or it.","translations":{"th":{"word":"มี","definition":"มี (ใช้กับ he/she/it)","history":"\"Has\" คือรูปที่ใช้กับ he, she หรือ it"}},"sentence":"She has a new bike.","thai":"มี"},{"id":"have","word":"have","letters":4,"spell":"have","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Possess or own.","history":"\"Have\" is a very irregular verb with many forms and is one of the most important helper verbs.","translations":{"th":{"word":"มี","definition":"มี เป็นเจ้าของ","history":"\"Have\" เป็นกริยาที่ผันผิดปกติมากและมีหลายรูป ทั้งยังเป็นกริยาช่วยที่สำคัญที่สุดคำหนึ่ง"}},"sentence":"I have two brothers.","thai":"มี"},{"id":"help","word":"help","letters":4,"spell":"help","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Make things easier for someone.","history":"'Help' is both a verb and a cry for assistance.","translations":{"th":{"word":"ช่วย","definition":"ช่วย (ทำให้บางสิ่งง่ายขึ้นสำหรับใครบางคน)","history":"\"Help\" เป็นได้ทั้งกริยาและคำร้องขอความช่วยเหลือ"}},"sentence":"Can you help me carry this?","thai":"ช่วย"},{"id":"here","word":"here","letters":4,"spell":"here","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"In this place.","history":"\"Here\" is one of the oldest location words in English.","translations":{"th":{"word":"ที่นี่","definition":"ที่นี่ (ในสถานที่นี้)","history":"\"Here\" เป็นคำบอกตำแหน่งที่เก่าแก่ที่สุดคำหนึ่งในภาษาอังกฤษ"}},"sentence":"Put your bag here.","thai":"ที่นี่"},{"id":"just","word":"just","letters":4,"spell":"just","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Only or very recently.","history":"\"Just\" has many uses in English and is very flexible.","translations":{"th":{"word":"เพิ่งจะ","definition":"เพิ่งจะ หรือ แค่","history":"\"Just\" มีหลายความหมายในภาษาอังกฤษและยืดหยุ่นมาก"}},"sentence":"I just arrived.","thai":"เพิ่งจะ"},{"id":"keep","word":"keep","letters":4,"spell":"keep","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Continue to have or do.","history":"'Keep' plus -ing means to continue: 'keep walking'.","translations":{"th":{"word":"เก็บ","definition":"เก็บ หรือ ทำต่อไป","history":"\"Keep\" ตามด้วย -ing แปลว่าทำต่อไปเรื่อยๆ เช่น \"keep walking\""}},"sentence":"Keep the change.","thai":"เก็บ"},{"id":"know","word":"know","letters":4,"spell":"know","topic":"High-Frequency / Core","topic2":"Education","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Understand or have knowledge.","history":"\"Know\" and \"no\" sound exactly the same but come from completely different old words. English has many of these \"homophones\".","translations":{"th":{"word":"รู้","definition":"รู้ เข้าใจ หรือมีความรู้","history":"\"Know\" กับ \"no\" ออกเสียงเหมือนกันเป๊ะแต่มาจากคำโบราณคนละคำ ภาษาอังกฤษมีคำพ้องเสียงแบบนี้เยอะมาก"}},"sentence":"I know the answer.","thai":"รู้"},{"id":"last","word":"last","letters":4,"spell":"last","topic":"High-Frequency / Core","topic2":null,"sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Coming after all others.","history":"\"Last\" is the opposite of first.","translations":{"th":{"word":"สุดท้าย","definition":"สุดท้าย (มาหลังสิ่งอื่นทั้งหมด)","history":"\"Last\" เป็นคำตรงข้ามกับ first"}},"sentence":"That was the last cookie.","thai":"สุดท้าย"},{"id":"learn","word":"learn","letters":5,"spell":"learn","topic":"High-Frequency / Core","topic2":"Education","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Gain knowledge or skill.","history":"Both 'learned' and 'learnt' are correct, depending on the country.","translations":{"th":{"word":"เรียนรู้","definition":"เรียนรู้ (ได้ความรู้หรือทักษะ)","history":"ทั้ง \"learned\" และ \"learnt\" ถูกต้องทั้งคู่ ขึ้นอยู่กับประเทศ"}},"sentence":"I want to learn Thai.","thai":"เรียนรู้"},{"id":"like","word":"like","letters":4,"spell":"like","topic":"High-Frequency / Core","topic2":"Emotions & Feelings","sublist":"Everyday Verbs & Function Words","phase":1,"starter":false,"rudeness":null,"definition":"Enjoy or similar to.","history":"\"Like\" has two completely different modern uses: \"I like apples\" and \"It looks like rain\". Both are
