<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocap — M1 prototype (gray boxes)</title>
<style>
  /* ============================================================
     M1 = deliberately ugly. Gray boxes. If this is fun, art will
     only make it better. Everything visual here is placeholder.
     ============================================================ */
  /* A lamplit study: dark walnut and leather, ivory letter tiles like real
     wooden pieces, and a sage green that reads as something growing rather
     than something alerting. */
  /* Paper on a desk: a cream page, dark walnut letter tiles with the letter
     printed in warm white, and terracotta for anything worth noticing. */
  :root{
    --bg:#2a231e;           /* refined walnut desk - a touch darker and cooler   */
    --panel:#332a23;        /* a slightly lighter surface for panels             */
    --box:#3a2f27;          /* an empty slot in the tray                         */
    --box-lit:#443830;
    --tile:#efe6d8;         /* cream letter tile                                 */
    --tile-ink:#33291f;     /* the letter printed on it                          */
    --glow:#dd8f65;         /* terracotta, softened                              */
    --glow-soft:#c17a52;
    --text:#f1e9db;         /* cream text                                        */
    --dim:#a89880;          /* faded taupe                                       */
    --faint:#8c7d68;        /* one step past dim - for the quietest text on screen */
    --good:#8fae6f; --bad:#d9825a;
    --line:#4a3d30;         /* the one hairline-border colour, used everywhere -
                                three near-identical greys (#5a4835/#55442f/#4a4d55)
                                used to do this job separately */
    --serif:'Palatino Linotype',Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  /* Sit the whole thing in the middle of the window. `safe center` keeps the
     top reachable when the content is taller than the window, which plain
     centring would clip. */
  body{background:radial-gradient(120% 100% at 50% 20%, #372e26 0%, var(--bg) 68%);
       background-attachment:fixed;
       color:var(--text);font-family:system-ui,'Noto Sans Thai',sans-serif;
       margin:0;min-height:100vh;box-sizing:border-box;
       display:flex;flex-direction:column;align-items:center;
       justify-content:safe center;
       padding:16px 12px;gap:12px;
       max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  h1{letter-spacing:5px;color:var(--text);font-weight:500;font-size:27px;
     margin:0 0 4px;text-indent:5px;font-family:var(--serif)}

  /* --- the tray: one gray box per letter slot --- */
  .trayrow{display:flex;align-items:flex-start;justify-content:center;gap:16px;max-width:100%}
  .trayrow>.tray,.trayrow>#tray,.trayrow>#rtray{flex:1;min-width:0}
  #tray,.tray{display:flex;gap:8px;min-height:64px;align-items:center;flex-wrap:wrap;
        justify-content:center;max-width:100%}
  .slot{width:52px;height:60px;border-radius:9px;background:var(--panel);
        display:flex;align-items:center;justify-content:center;font-size:26px;
        font-weight:700;border:1px solid transparent;text-transform:uppercase}
  .slot.filled{background:var(--tile);color:var(--tile-ink);
               border-color:#e9ddc9;font-weight:600;
               box-shadow:0 1px 0 rgba(255,255,255,.35)}
  .slot.typed{background:var(--tile);color:var(--tile-ink);
              border-color:var(--glow);box-shadow:0 0 0 2px rgba(221,143,101,.35)}   /* highlighted while typing */
  .slot.empty{opacity:.6;border-color:var(--line)}

  /* --- the clue line: the learning mechanic, front and centre --- */
  #clue{font-size:16px;line-height:1.6;
  min-height:24px;color:var(--glow);font-size:15px;text-align:center;
        max-width:min(640px,100%);line-height:1.6}
  #clue.spellable{text-shadow:0 0 12px var(--glow)}
  .clueline{margin:6px 0}
  .cl-th2{color:var(--glow);font-size:14px;margin-top:2px}
  .cl-n2{color:var(--dim);font-size:11px;margin-top:2px}
  .hintbar{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
  .hintbar button{border-color:var(--line);
  font-size:11px;padding:3px 8px;border-radius:5px;opacity:.75}
  .hintbar button:hover:not(:disabled){opacity:1}
  .hintbar button:disabled{opacity:.3;cursor:default}
  .hintbar button.solve{border-color:var(--glow);color:var(--glow)}
  .reveal{font-family:monospace;letter-spacing:4px;font-size:17px;color:var(--text)}                 /* the "glow" from §3.6 */

  .slot.used{background:var(--box);color:var(--dim);
             border-color:var(--glow);box-shadow:none;opacity:.55}
  .slot.filled{cursor:pointer}
  .slot.filled:hover{border-color:var(--glow)}

  /* --- the word tray: where letters go to become a word --- */
  .wordtray.thai{min-height:74px;align-items:center;justify-content:center}
  .thword{font-size:40px;line-height:1.5;letter-spacing:1px;
          font-family:'Noto Sans Thai','Leelawadee UI',system-ui,sans-serif}
  .hintline{color:var(--dim);font-size:13px}
  .marksrow{display:none;flex-direction:column;gap:6px;justify-content:center;
             margin:0;padding-left:14px;border-left:1px solid var(--line);flex:0 0 auto}
  .marksrow .slot.mark{width:38px;height:42px;font-size:20px;opacity:.9}
  .marksrow .slot.mark:hover{border-color:var(--glow)}
  #marks{display:none;flex-direction:column;gap:6px;justify-content:center;
         margin:0;padding-left:14px;border-left:1px solid var(--line);flex:0 0 auto}
  #marks .slot.mark{width:38px;height:42px;font-size:20px;opacity:.9}
  #marks .slot.mark:hover{border-color:var(--glow)}
  #wordtray,.wordtray{background:rgba(0,0,0,.14);border-radius:9px;
  display:flex;gap:6px;min-height:56px;align-items:center;justify-content:center;
            padding:10px 14px;
            width:min(560px,100%);flex-wrap:wrap;border:1px solid var(--line)}
  #wordtray.ready{border-color:var(--good);border-style:solid}
  #wordtray .wslot{width:44px;height:50px;border-radius:7px;background:var(--box-lit);
        display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
        text-transform:uppercase;cursor:pointer;border:1px solid var(--glow)}
  #wordtray .wslot.space{background:transparent;border:1px dashed var(--line);width:22px}
  #wordtray .hint{color:var(--dim);font-size:13px}

  /* --- submit / clear buttons (essential on touch: no keyboard, no Enter key) --- */
  #actions{display:flex;gap:10px}
  #actions button{padding:11px 26px;font-size:15px;font-weight:600;border-radius:9px}
  #submit{background:var(--good);color:#16210f;border-color:var(--good)}
  #submit:disabled{background:var(--panel);color:var(--dim);border-color:var(--line);font-weight:400}
  /* bigger touch targets on small screens */
  @media (max-width:700px){
    /* tiles scale with the screen so a full 15-slot tray always fits */
    .slot{width:min(46px,10.5vw);height:min(54px,13vw);font-size:min(22px,5.4vw);border-radius:6px}
    #tray{gap:5px;min-height:auto}
    /* no room for a side column on a phone screen - marks drop below as a row */
    .trayrow{flex-direction:column;align-items:center}
    #marks,.marksrow{flex-direction:row;border-left:none;border-top:1px solid var(--line);
                      padding-left:0;padding-top:8px}
    #wordtray .wslot{width:min(40px,9.5vw);height:min(48px,12vw);font-size:min(20px,5vw)}
    #wordtray{gap:4px;padding:8px 10px}
    #actions button{padding:14px 32px;font-size:16px}
    /* A single segmented strip rather than separate buttons, so the controls
     read as one object instead of six competing ones. */
  /* Everything on show. Hiding half the controls behind a gear saved a row and
     cost the player the ability to see, at a glance, what language the clues
     are in - which is the setting they most need to know. */
  #controls{display:inline-flex;gap:1px;flex-wrap:wrap;justify-content:center;
            margin:8px auto 0;border:1px solid var(--line);border-radius:10px;
            overflow:hidden;background:var(--line);max-width:560px}
  #controls button{font-size:12px;padding:7px 11px;border:none;border-radius:0;
                   background:var(--tile);color:var(--tile-ink);flex:1 1 auto;
                   white-space:nowrap}
  #controls button:hover{background:#fffaf0}
  #controls button.on{background:var(--glow);color:#fff}


  #bar{letter-spacing:.2px;
  gap:12px;font-size:12px}
    #bar button{padding:8px 12px}
    h1{font-size:22px;letter-spacing:3px;text-indent:3px}
    #clue{font-size:14px}
    #card{padding:14px 16px}
    #card h2{font-size:22px}
  }

  /* --- typing area (kept for the letter count) --- */
  #typed{font-size:13px;letter-spacing:2px;min-height:18px;color:var(--dim)}
  #msg{min-height:22px;color:var(--dim);font-size:14px}
  #msg.good{color:var(--good)} #msg.bad{color:#e07a7a}

  /* --- status bar --- */
  /* A single segmented strip rather than separate buttons, so the controls
     read as one object instead of six competing ones. */

  #controls button:hover{background:#fffaf0}
  #controls button.on{background:var(--glow);color:#fff}


  #bar{display:flex;gap:22px;color:var(--dim);font-size:13px;align-items:center;flex-wrap:wrap;justify-content:center}
  #bar b{color:var(--text)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;
         padding:6px 13px;cursor:pointer;font-size:13px;transition:border-color .15s ease}
  button:hover{border-color:var(--glow)}

  /* --- discovery card ---------------------------------------------
     Sits alongside the tray rather than taking over, but announces itself
     in proportion to the word. Short words get a quiet entrance; long ones
     get a longer glow and a slower reveal. */
  #card{display:none;position:relative;background:var(--panel);border-radius:14px;
        padding:18px 46px 16px 18px;width:min(620px,100%);border:1px solid var(--line);
        gap:16px;align-items:flex-start}
  #card.show{display:flex;animation:cardIn .45s cubic-bezier(.2,.9,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}
                    to{opacity:1;transform:none}}

  /* celebration scales with word length, quietly - the border warms up
     tier by tier, and only the longest words earn an actual glow */
  #card.tier1{border-color:var(--line)}
  #card.tier2{border-color:var(--glow-soft)}
  #card.tier3{border-color:var(--glow)}
  #card.tier4{border-color:var(--glow);box-shadow:0 0 24px -8px rgba(221,143,101,.35);
              animation:cardIn .45s cubic-bezier(.2,.9,.3,1), bigPulse 1.6s ease-out}
  @keyframes bigPulse{0%{box-shadow:0 0 0 0 rgba(221,143,101,.25)}
                      100%{box-shadow:0 0 24px -8px rgba(221,143,101,.35)}}

  /* reserved art slot — a real illustration drops in here later */
  #c-art{flex:0 0 84px;height:84px;border-radius:10px;background:rgba(0,0,0,.14);
         display:flex;align-items:center;justify-content:center;font-size:30px;
         border:1px solid var(--line);color:var(--faint)}
  #c-body{flex:1;min-width:0}

  #c-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:2px}
  #card h2{margin:0;font-size:25px;line-height:1.15;
           font-family:var(--serif);font-weight:600}
  .speakbtn{background:transparent;border:1px solid var(--line);color:var(--dim);
            border-radius:20px;width:26px;height:26px;font-size:13px;padding:0;
            display:inline-flex;align-items:center;justify-content:center;
            cursor:pointer;line-height:1;flex:0 0 auto}
  .speakbtn:hover{border-color:var(--glow);color:var(--glow)}
  #c-pos{font-size:12px;color:var(--dim);font-style:italic}
  #c-spark{margin-left:auto;font-size:13px;color:var(--glow);white-space:nowrap}
  #card .th{color:var(--glow);font-size:17px;margin-bottom:6px}
  #card p{margin:5px 0;font-size:14px;line-height:1.55}
  #c-thdef{color:var(--faint)}
  #c-factbox{border-left:2px solid var(--line);padding-left:11px;margin:10px 0}
  #c-factbox p{margin:3px 0;font-size:13px;color:var(--faint)}
  #c-sent{font-style:italic;color:var(--dim);font-size:13px}
  #c-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  #c-tags span{font-size:11px;background:rgba(0,0,0,.16);border:1px solid var(--line);
               border-radius:20px;padding:3px 10px;color:var(--dim)}
  #c-close{position:absolute;top:8px;right:10px;background:none;border:none;
           color:var(--dim);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
  #c-close:hover{color:var(--text)}

  /* dictionary words share the card but stay visibly plainer */
  #card.dict{border-style:dashed;box-shadow:none}
  #card.dict h2{font-size:22px;color:var(--dim)}
  #card.dict #c-art{opacity:.5}
  #card.dict #c-thdef{color:var(--text);font-size:14px}

  #lookup{display:none;margin-top:10px}
  #card.dict #lookup{display:block}
  #lookup a{color:var(--glow);font-size:12px;text-decoration:none;border:1px solid var(--line);
            border-radius:6px;padding:5px 11px;display:inline-block}
  #lookup a:hover{border-color:var(--glow)}

  @media (max-width:700px){
    #card{flex-direction:column;padding:16px 40px 14px 16px}
    #c-art{flex:0 0 auto;width:64px;height:64px;font-size:26px}
    #card h2{font-size:23px}
  }

  /* --- race mode -------------------------------------------------
     A separate mode you enter deliberately. Two people type the same code,
     get the same fifteen letters, and race a clock. No server involved: the
     code IS the shared state. */
  #race{display:none;position:fixed;inset:0;z-index:70;overflow-y:auto;
        background:radial-gradient(130% 100% at 50% 30%, #3d3026 0%, var(--bg) 70%);
        padding:22px 14px}
  #race.show{display:block}
  #race .sheet{max-width:620px;margin:0 auto;text-align:center}
  #race h2{font-size:23px;letter-spacing:3px;margin:6px 0 2px;font-weight:600;font-family:var(--serif)}
  #race .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  #race .field{margin:14px 0}
  #race label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;
              letter-spacing:1px;text-transform:uppercase}
  #race input{background:var(--panel);border:1px solid var(--line);color:var(--text);
              border-radius:8px;padding:10px 14px;font-size:19px;text-align:center;
              letter-spacing:4px;font-family:monospace;width:210px;text-transform:uppercase}
  #race .opts{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  #race .opts button{border:none;border-radius:0;background:var(--panel);
                     border-right:1px solid var(--line);font-size:12px;padding:8px 13px}
  #race .opts button:last-child{border-right:none}
  #race .opts button.on{background:var(--glow);color:#fff}
  /* Hosting and joining are equally normal things to do, so they get equal
     weight. The join button is outlined rather than filled only so you can
     tell them apart at a glance, not because it matters less. */
  #race .gorow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  #race .go{font-size:15px;font-weight:700;letter-spacing:2px;padding:12px 26px;
            border-radius:10px;background:var(--glow);color:#fff;border-color:var(--glow)}
  #race .go:hover{background:#e9a173;border-color:#e9a173}
  #race .go.alt{background:transparent;color:var(--glow);border:2px solid var(--glow)}
  #race .go.alt:hover{background:rgba(221,143,101,.14)}
  #race .clock{font-size:44px;font-weight:900;letter-spacing:2px;margin:6px 0}
  #race .clock.low{color:var(--bad)}
  #race .tally{color:var(--dim);font-size:14px;margin-bottom:10px}
  #race .found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  #race .roster{max-width:320px;margin:10px auto;text-align:left}
  #race .rrow{display:flex;justify-content:space-between;gap:10px;
              padding:6px 11px;border-radius:7px;font-size:13px;
              background:var(--panel);border:1px solid var(--line);margin-bottom:4px}
  #race .rrow.me{border-color:var(--glow)}
  #race .rrow em, #race .brow em{display:block;font-style:normal;font-size:10px;
       color:var(--glow);letter-spacing:1px;text-transform:uppercase}
  /* Racing is a mode you choose, not a toggle you might miss, so it gets a
     button of its own rather than an icon in a row of six. */
  /* Modes and language both live behind one small trigger in the corner
     rather than scattered across the main screen. Play Together used to be
     a big button in the middle of the tray; now it is one row inside this
     menu, same as any mode that comes after it. */
  #gamepill{position:fixed;top:10px;right:12px;z-index:40}
  #gamepill button{border:1px solid var(--line);border-radius:8px;background:var(--panel);
            color:var(--text);font-size:11px;letter-spacing:1px;padding:6px 12px;cursor:pointer}
  #gamepill button:hover{border-color:var(--glow)}

  /* The two buttons you press constantly sit together. Leaving is pushed well
     away and styled as a warning, because people were quitting by accident. */
  #race .statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
                  max-width:480px;margin:14px auto}
  #race .statgrid div{background:var(--panel);border:1px solid var(--line);
                      border-radius:8px;padding:8px 4px}
  #race .statgrid b{display:block;font-size:17px;color:var(--glow)}
  #race .statgrid small{color:var(--dim);font-size:10px}
  #race .titles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px;margin:8px auto}
  #race .tsel{font-size:11px;padding:5px 11px}
  #race .tsel.on{background:var(--glow);color:#fff;border-color:var(--glow)}
  #race .trophies{max-width:480px;margin:8px auto;text-align:left}
  #race .trow{background:var(--panel);border:1px solid var(--line);border-radius:9px;
              padding:9px 12px;margin-bottom:6px}
  #race .thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #race .thead small{color:var(--dim);font-size:11px}
  #race .pips{display:flex;gap:4px}
  #race .pips i{width:9px;height:9px;border-radius:50%;border:1px solid #6b5540;display:block}
  #race .pips i.lit{background:#b08d57;border-color:#b08d57}
  #race .pips i.lit.silver{background:#c9c9c9;border-color:#c9c9c9}
  #race .pips i.lit.gold{background:#d9a441;border-color:#d9a441}
  #race .pips i.lit.platinum{background:#dfe6ea;border-color:#dfe6ea}
  #race .bar{height:5px;background:rgba(0,0,0,.28);border-radius:3px;margin:7px 0 4px;overflow:hidden}
  #race .bar i{display:block;height:100%;background:var(--glow)}
  #race .tfoot{color:var(--dim);font-size:11px}
  #race .unlocks{max-width:420px;margin:14px auto 6px}
  #race .unlock{display:flex;gap:11px;align-items:center;text-align:left;
                background:var(--panel);border:1px solid var(--glow);
                border-radius:10px;padding:10px 13px;margin-bottom:6px}
  #race .unlock small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  #race .tro{font-size:20px}
  #race .tro.bronze{filter:hue-rotate(-18deg) saturate(.7)}
  #race .tro.silver{filter:grayscale(1) brightness(1.5)}
  #race .tro.platinum{filter:brightness(1.35) saturate(.4)}
  #race .laurelrow{color:var(--glow);font-size:13px;margin:10px 0}
  #race .laurelrow span{color:var(--dim)}
  #race .playrow{display:flex;gap:8px;justify-content:center;margin-top:12px}
  #race .playrow button{font-size:14px;padding:9px 22px}
  #race .playrow .psubmit{background:var(--glow);color:#fff;border-color:var(--glow)}
  #race .quitrow{margin-top:26px;padding-top:14px;border-top:1px solid rgba(90,72,53,.5)}
  #race .quit{font-size:11px;padding:5px 12px;opacity:.55;
              background:transparent;color:var(--dim)}
  #race .quit:hover{opacity:1;color:var(--bad);border-color:var(--bad)}
  /* Fifteen tiles is a lot of width. Shrinking them keeps the tray on two
     rows and leaves the clues visible without scrolling. */
  .racetray .slot{width:40px;height:46px;font-size:19px;border-radius:6px}
  @media (max-width:520px){ .racetray .slot{width:min(34px,7.6vw);height:min(40px,9vw);font-size:16px} }
  #race .board{max-width:400px;margin:12px auto;text-align:left}
  #race .linkbox{max-width:420px;margin:14px auto;padding:11px;border-radius:9px;
                 background:var(--panel);border:1px solid var(--line)}
  #race .linkbox code{font-size:12px;color:var(--glow);word-break:break-all}
  #race .brow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:5px;
              background:var(--panel);border:1px solid var(--line);border-radius:9px}
  #race .brow.me{border-color:var(--glow);background:rgba(221,143,101,.10)}
  #race .brow .pos{width:26px;font-size:15px}
  #race .brow .nm{flex:1;font-size:14px}
  #race .brow .nm i{color:var(--dim);font-size:11px;font-style:normal}
  #race .brow .pts{text-align:right;font-size:15px}
  #race .brow .pts b{color:var(--glow)}
  #race .brow .pts small{display:block;color:var(--dim);font-size:11px}
  #race .waitdot{color:var(--dim);font-size:13px;margin-top:12px}
  #race .waitdot:after{content:'';animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  #race .rrow b{color:var(--glow)}
  #race #rclues{margin:10px auto 6px;font-size:14px;line-height:1.45;max-width:460px}
  #race #rclues .clueline{background:var(--panel);border:1px solid var(--line);
       border-radius:9px;padding:8px 11px;margin:5px 0;text-align:left}
  #race #rclues .clueline.done{opacity:.4;text-align:center}
  #race #rclues .cl-th{color:var(--glow);font-size:13px;margin-top:3px}
  #race #rclues .cl-n{color:var(--dim);font-size:11px;margin-top:3px}
  #race #rclues .x2{color:var(--glow);font-weight:700;margin-left:6px;font-size:12px}
  #race .found span{background:var(--panel);border:1px solid var(--line);border-radius:7px;
                    padding:4px 9px;font-size:13px}
  #race .share{background:var(--panel);border:1px solid var(--line);border-radius:8px;
               padding:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;
               margin:14px 0;text-align:left}

  /* --- overlay panels: Collection + Dictionary --- */
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
           padding:24px 12px;overflow-y:auto}
  #overlay.show{display:block}
  /* A word opened from a list shows here, over the list, so you keep your
     place instead of being thrown back to the tray. */
  #popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
         z-index:60;padding:24px 12px;overflow-y:auto}
  #popup.show{display:block}
  #popcard{position:relative;background:var(--panel);border:1px solid var(--glow);
           border-radius:14px;max-width:620px;margin:6vh auto 0;padding:18px 46px 16px 18px;
           display:flex;gap:16px;align-items:flex-start;
           animation:cardIn .3s cubic-bezier(.2,.9,.3,1)}
  #popcard.dict{border-color:var(--line);border-style:dashed}
  #popcard #c-close{position:absolute;top:8px;right:10px;background:none;border:none;
           color:var(--dim);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
  #popcard #c-close:hover{color:var(--text)}
  @media (max-width:700px){ #popcard{flex-direction:column;padding:16px 40px 14px 16px} }
  #panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:820px;
         margin:0 auto;padding:20px 22px 28px}
  #panel h2{margin:0;font-size:21px;font-family:var(--serif);font-weight:600}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:12px;
         border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  .phead .sub{color:var(--dim);font-size:13px;margin-top:3px}
  #panel .back{background:none;border:none;color:var(--glow);cursor:pointer;font-size:14px;
               padding:0;margin-bottom:12px}

  /* topic rows */
  .trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;
        cursor:pointer;border:1px solid transparent}
  .trow:hover{background:var(--panel);border-color:var(--line)}
  .trow .nm{flex:1;font-size:15px}
  .trow .ct{color:var(--dim);font-size:13px;white-space:nowrap}
  .bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;width:120px}
  .bar i{display:block;height:100%;background:var(--glow);border-radius:3px}
  .trow.done .nm:after{content:' ✓';color:var(--good)}

  /* mode-menu rows: a language paired with a way to play, one list */
  .langcard{text-align:center;padding:34px 20px}
  .langcard b{font-size:19px;margin:0}

  .modegrid{display:grid;grid-template-columns:1fr;gap:8px}
  @media (min-width:520px){ .modegrid{grid-template-columns:1fr 1fr} }
  .modecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
            padding:16px 18px;cursor:pointer;text-align:left}
  .modecard:hover{border-color:var(--glow)}
  .modecard.here{border-color:var(--glow);
                 background:linear-gradient(180deg,rgba(221,143,101,.08),transparent 65%)}
  .modecard.locked{cursor:default;opacity:.55}
  .modecard .ic{font-size:21px;display:block;margin-bottom:8px}
  .modecard b{display:block;font-size:15px;font-family:var(--serif);font-weight:600;margin-bottom:3px}
  .modecard span{display:block;color:var(--dim);font-size:12.5px;line-height:1.5}

  /* word grid: found words and silhouettes */
  .sub-h{color:var(--dim);font-size:12px;letter-spacing:2px;margin:18px 0 8px;
         text-transform:uppercase}
  .wgrid{display:flex;flex-wrap:wrap;gap:7px}
  .wchip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;
         font-size:14px;cursor:pointer}
  .wchip:hover{border-color:var(--glow)}
  .wchip.hidden{background:transparent;border-style:dashed;color:var(--faint);cursor:default;
                letter-spacing:3px;font-family:monospace}
  .wchip.hidden:hover{border-color:var(--line)}

  /* dictionary shelves */
  .shelf{display:flex;flex-wrap:wrap;gap:6px}
  .letter{width:52px;height:52px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
          display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .letter b{font-size:18px;text-transform:uppercase}
  .letter span{font-size:10px;color:var(--dim)}
  .letter.empty{opacity:.3;cursor:default}
  .letter:hover:not(.empty){border-color:var(--glow)}

  /* --- found-this-cycle log --- */
  #log{font-size:13px;color:var(--dim);max-width:640px;text-align:center;line-height:1.8}
  #log span{background:var(--panel);border-radius:5px;padding:2px 8px;margin:2px}

  /* --- puzzle overlay: Anagram / Listening -------------------------------
     Same full-screen treatment as #race, since only one mode is ever open
     at a time. The tray/word-bar/message pieces reuse the main screen's own
     .tray/.wordtray/.msg classes; only the chrome around them is new. */
  #puzzle{display:none;position:fixed;inset:0;z-index:70;overflow-y:auto;
          background:radial-gradient(130% 100% at 50% 30%, #3d3026 0%, var(--bg) 70%);
          padding:22px 14px}
  #puzzle.show{display:block}
  #puzzle .sheet{max-width:560px;margin:0 auto;text-align:center}
  #pzStages{display:none;flex-direction:column;gap:8px;text-align:left}
  #pzStages .modegrid{margin-top:4px}
  #pzArea{display:flex;flex-direction:column;align-items:center;gap:2px}
  #pzStageBack{all:unset;cursor:pointer;color:var(--dim);font-size:12px;margin-bottom:10px}
  #pzStageBack:hover{color:var(--glow)}
  #puzzle h2{font-size:23px;letter-spacing:3px;margin:6px 0 4px;font-weight:600;font-family:var(--serif)}
  #puzzle .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  #puzzle .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  #puzzle .quitrow{margin-top:22px;padding-top:14px;border-top:1px solid rgba(90,72,53,.5)}
  #puzzle .quitrow button{font-size:11px;padding:5px 12px;opacity:.55;background:transparent;color:var(--dim)}
  #puzzle .quitrow button:hover{opacity:1;color:var(--text)}
  #pzClue{color:var(--glow);font-size:15px;line-height:1.6;margin-bottom:16px;min-height:22px}
  .primary{background:var(--good);color:#123;border-color:var(--good)}
  .primary:hover{background:#9fc07f}

  #pzCard{display:none;position:relative;background:var(--panel);
          border-radius:14px;padding:16px 20px 14px;margin:16px 0 0;text-align:left;
          border:1px solid var(--line);gap:14px}
  #pzCard.show{display:flex;animation:cardIn .4s cubic-bezier(.2,.9,.3,1)}
  #pzCard .art{flex:0 0 56px;height:56px;border-radius:9px;background:rgba(0,0,0,.18);
               display:flex;align-items:center;justify-content:center;font-size:22px}
  #pzCard .body{flex:1;min-width:0}
  #pzCard h3{margin:0;font-size:20px;line-height:1.2;
               font-family:var(--serif);font-weight:600}
  #pzCard h3 .speakbtn{vertical-align:middle;margin-left:2px}
  #pzCard h3 .spark{font-size:12.5px;color:var(--glow);font-weight:400;margin-left:8px;
                     white-space:nowrap}
  #pzCard .th{color:var(--glow);font-size:16px;margin:3px 0 6px}
  #pzCard p{margin:4px 0;font-size:13.5px;line-height:1.55;color:var(--text)}
  #pzCard .thdef{color:var(--faint)}
  #pzCard .fact{border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
  #pzCard .fact p{font-size:12.5px;color:var(--faint)}
  #pzCard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #pzCard .tags span{font-size:11px;background:rgba(0,0,0,.20);border:1px solid var(--line);
                      border-radius:20px;padding:3px 10px;color:var(--dim)}
</style>
</head>
<body>
<div id="gamepill"></div>
<h1>VOCAP</h1>

<div id="bar">
  <span>✨ <b id="sparks">0</b></span>
  <span>tray <b id="traysize">8</b></span>
  <span>found <b id="foundcount">0</b>/<b id="total">?</b></span>
  <span>📖 <b id="inkcount">0</b></span>
  <span id="timerbar" style="display:none">next <b id="timer">–</b></span>
</div>

<div style="text-align:center"><div id="controls">
  <button id="ivl" title="how often a letter drops" style="display:none">⏱ 5 min</button>
  <button id="speed" title="fill the tray straight away" style="display:none">⚡ fill tray</button>
  <button id="skip" title="end this run early">⏭ next</button>
  <button id="lang" title="add a language you are learning">+ ไทย</button>
  <button id="say" title="speak each word found">🔊 words: ON</button>
  <button id="sayl" title="speak each letter tapped">🔤 letters: OFF</button>
  <button id="book" title="your collection">📚 collection</button>
  <button id="dictbtn" title="dictionary">📖 dictionary</button>
  <button id="promote" title="most-formed dictionary words">📈 top words</button>
  <button id="reset" title="wipe progress">reset</button>
</div></div>

<div id="clue"></div>
<div class="trayrow">
  <div id="tray"></div>
  <div id="marks"></div>
</div>
<div id="wordtray"></div>
<div id="actions">
  <button id="submit" disabled>Submit</button>
  <button id="clear">Clear</button>
</div>
<div id="typed"></div>
<div id="msg">tap or type letters · Space is free</div>

<div id="card">
  <div id="c-art"></div>
  <div id="c-body">
    <div id="c-head">
      <h2 id="c-word"></h2>
      <span id="c-pos"></span>
      <span id="c-spark"></span>
    </div>
    <div class="th" id="c-thword"></div>
    <p id="c-def"></p>
    <p id="c-thdef"></p>
    <div id="c-factbox"><p id="c-hist"></p><p id="c-thhist"></p></div>
    <p id="c-sent"></p>
    <div id="c-tags"></div>
    <div id="lookup"><a id="c-lookup" target="_blank" rel="noopener">ดูคำแปลไทย · look up in Thai ↗</a></div>
  </div>
  <button id="c-close" title="close">×</button>
</div>

<div id="log"></div>

<div id="race"></div>

<div id="puzzle">
  <div class="sheet">
    <h2 id="pzTitle"></h2>
    <div class="sub" id="pzSub"></div>

    <div id="pzStages"></div>

    <div id="pzArea">
      <button id="pzStageBack" onclick="showPuzzleStages()" style="display:none">↑ choose a different stage</button>
      <div class="clueline" id="pzClue"></div>
      <div class="row" id="pzListenRow" style="display:none">
        <button id="pzPlay" onclick="puzzlePlayAgain()">🔊 play the word</button>
      </div>
      <div class="tray" id="pzTray"></div>
      <div class="wordtray" id="pzWordbar"></div>
      <div class="row">
        <button id="pzClear" onclick="puzzleClear()">Clear</button>
        <button id="pzSubmit" class="primary" onclick="submitPuzzle()">Submit</button>
        <button id="pzShuffle" onclick="puzzleShuffle()">🔀 shuffle</button>
      </div>
      <div class="msg" id="pzMsg"></div>
      <div id="pzCard"></div>
      <div class="row"><button id="pzNext" onclick="puzzleNext()">⏭ new word</button></div>
    </div>

    <div class="quitrow"><button id="pzBack" onclick="closePuzzle()">← back to the game</button></div>
  </div>
</div>

<div id="overlay"><div id="panel"></div>
  <div id="popup"><div id="popcard"></div></div>
</div>

<script>
/* This page is the English game / Thai game. It sets the configuration and
   then hands over to the shared engine, which contains all of the actual
   game. Anything language-specific belongs here or in the data file, never
   in the engine. */
window.VOCAP_CONFIG = {
  game:      'th',
  data:      'words-th.json',
  dict:      null,                // no Thai dictionary yet; curated words only
  trayStart: 12,                  // Thai draws from 61 tile characters, not 26
  trayMax:   18
};
</script>
<script src="engine.js"></script>

</body>
</html>
